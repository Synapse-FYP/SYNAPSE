            <div class="row"><button type="button" class="btn btn-secondary" onClick="{{prof.behavior}}">Behavioral Intelligence</button><button type="button" class="btn btn-secondary" onClick="{{prof.graph}}">Show in graph</button><sc-if value="{{isAnalyst}}" hint-placeholder-val="{{false}}"><button type="button" class="btn btn-primary" onClick="{{prof.assign}}">Assign intervention</button></sc-if></div>
          </div>
          <div class="tabs" role="tablist"><sc-for list="{{pTabs}}" as="t" hint-placeholder-count="5"><button type="button" role="tab" class="{{t.cls}}" aria-selected="{{t.sel}}" onClick="{{t.go}}">{{t.label}}</button></sc-for></div>

          <sc-if value="{{pt.overview}}" hint-placeholder-val="{{true}}">
            <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr))">
              <section class="card card-b" style="padding: 16px"><h2 style="margin-bottom: 10px">Employee details</h2><dl class="kv" style="margin: 0"><dt>Email</dt><dd>{{prof.email}}</dd><dt>Department</dt><dd>{{prof.dept}}</dd><dt>Role</dt><dd>{{prof.role}}</dd><dt>Site</dt><dd>{{prof.site}}</dd><dt>Joined</dt><dd>{{prof.hired}}</dd><dt>Account status</dt><dd>{{prof.status}}</dd><dt>Open alerts</dt><dd>{{prof.open}} of {{prof.total}} total</dd></dl></section>
              <section class="card card-b" style="padding: 16px"><h2 style="margin-bottom: 10px">Registered devices</h2>
                <sc-if value="{{prof.hasDevices}}" hint-placeholder-val="{{true}}"><sc-for list="{{prof.devices}}" as="d" hint-placeholder-count="1"><div class="row small" style="justify-content: space-between"><span class="row" style="gap: 8px"><span class="{{d.cls}}"></span><span class="mono">{{d.name}}</span></span><span class="muted">{{d.status}} · {{d.last}}</span></div></sc-for></sc-if>
                <div class="stack" style="gap: 6px; margin-top: 10px"><sc-for list="{{prof.removables}}" as="r" hint-placeholder-count="1"><div class="row small" style="justify-content: space-between"><span>{{r.label}} <span class="mono tiny muted">{{r.serial}}</span></span><span class="{{r.cls}}">{{r.approved}}</span></div></sc-for></div>
              </section>
              <section class="card card-b" style="padding: 16px"><h2 style="margin-bottom: 10px">Recent events</h2><div class="stack" style="gap: 6px"><sc-for list="{{prof.events}}" as="ev" hint-placeholder-count="3"><div class="small"><span class="mono tiny muted">{{ev.when}}</span><div>{{ev.detail}}</div></div></sc-for></div></section>
            </div>
          </sc-if>

          <sc-if value="{{pt.behavior}}" hint-placeholder-val="{{false}}">
            <sc-if value="{{prof.hasBaseline}}" hint-placeholder-val="{{true}}">
              <sc-if value="{{prof.limited}}" hint-placeholder-val="{{false}}"><div class="banner banner-warn">Limited history: fewer than 10 baseline days, so the population baseline is used. Deviations are less reliable for this employee.</div></sc-if>
              <div class="banner banner-sim">Behavioral history uses simulated demonstration events. Baselines follow the CERT r5.2 method: training-period mean and standard deviation per employee and feature, SD floor 10% of the population SD, deviations clipped to ±20, population fallback below 10 training days.</div>
              <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr))">
                <section class="card"><div class="card-h"><h2>Current week versus historical average</h2><span class="legend"><span><i class="lg-sw" style="background: #E6ECF5"></i>Last 7 days</span><span><i class="lg-sw" style="background: #2F6E8C"></i>Baseline</span></span></div>
                  <div class="card-b stack" style="gap: 12px"><sc-for list="{{prof.compare}}" as="c" hint-placeholder-count="5"><div class="stack" style="gap: 4px"><div class="row small" style="justify-content: space-between"><span>{{c.label}}</span><span class="mono">{{c.cur}} vs {{c.base}}/day · {{c.delta}}</span></div><div class="bar-track" style="height: 7px"><div class="bar-fill" style="width: {{c.cw}}%; background: #E6ECF5"></div></div><div class="bar-track" style="height: 7px"><div class="bar-fill" style="width: {{c.bw}}%; background: #2F6E8C"></div></div></div></sc-for></div></section>
                <section class="card"><div class="card-h"><h2>Normal versus unusual working time</h2><span class="tiny muted">Share of events outside 08:00–18:00 or at weekends</span></div>
                  <div class="card-b stack" style="gap: 14px">
                    <div><div class="row small" style="justify-content: space-between"><span>Baseline period</span><span class="mono">{{prof.work.baseOff}}% off-hours</span></div><div style="display: flex; height: 22px; border-radius: 5px; overflow: hidden; margin-top: 4px"><div style="width: {{prof.work.baseW}}%; background: #22D3EE"></div><div style="width: {{prof.work.baseOffW}}%; background: #8B5CF6"></div></div></div>
                    <div><div class="row small" style="justify-content: space-between"><span>Last 7 days</span><span class="mono">{{prof.work.curOff}}% off-hours</span></div><div style="display: flex; height: 22px; border-radius: 5px; overflow: hidden; margin-top: 4px"><div style="width: {{prof.work.curW}}%; background: #22D3EE"></div><div style="width: {{prof.work.curOffW}}%; background: #8B5CF6"></div></div></div>
                    <div class="legend"><span><i class="lg-sw" style="background: #22D3EE"></i>Working hours</span><span><i class="lg-sw" style="background: #8B5CF6"></i>Off-hours / weekend</span></div>
                    <p class="tiny muted" style="margin: 0">Off-hours boundaries are illustrative engineering assumptions; working late is not a violation.</p>
                  </div></section>
              </div>
              <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr))">
                <section class="card"><div class="card-h"><h3>Device activity trend</h3><span class="tiny muted mono">mean {{prof.devChart.mean}}/day</span></div><div class="card-b"><div class="chart" style="height: 120px"><svg viewBox="0 0 600 200" preserveAspectRatio="none" aria-hidden="true"><path d="{{prof.devChart.bandPath}}" fill="#22D3EE" fill-opacity="0.14"></path><path d="{{prof.devChart.path}}" fill="none" stroke="#E6ECF5" stroke-width="1.8" vector-effect="non-scaling-stroke"></path></svg></div><div class="chart-x"><span>{{prof.first}}</span><span>{{prof.last}}</span></div></div></section>
                <section class="card"><div class="card-h"><h3>File access frequency</h3><span class="tiny muted mono">mean {{prof.fileChart.mean}}/day</span></div><div class="card-b"><div class="chart" style="height: 120px"><svg viewBox="0 0 600 200" preserveAspectRatio="none" aria-hidden="true"><path d="{{prof.fileChart.bandPath}}" fill="#22D3EE" fill-opacity="0.14"></path><path d="{{prof.fileChart.path}}" fill="none" stroke="#E6ECF5" stroke-width="1.8" vector-effect="non-scaling-stroke"></path></svg></div><div class="chart-x"><span>{{prof.first}}</span><span>{{prof.last}}</span></div></div></section>
                <section class="card"><div class="card-h"><h3>Login behavior</h3><span class="tiny muted mono">mean {{prof.logonChart.mean}}/day</span></div><div class="card-b"><div class="chart" style="height: 120px"><svg viewBox="0 0 600 200" preserveAspectRatio="none" aria-hidden="true"><path d="{{prof.logonChart.bandPath}}" fill="#22D3EE" fill-opacity="0.14"></path><path d="{{prof.logonChart.path}}" fill="none" stroke="#E6ECF5" stroke-width="1.8" vector-effect="non-scaling-stroke"></path></svg></div><div class="chart-x"><span>{{prof.first}}</span><span>{{prof.last}}</span></div></div></section>
                <section class="card"><div class="card-h"><h3>Behavioral deviation over time</h3><span class="tiny muted">Max deviation per day (SD)</span></div><div class="card-b"><div class="chart" style="height: 120px"><svg viewBox="0 0 600 200" preserveAspectRatio="none" aria-hidden="true"><path d="M0 {{prof.devzChart.thresh}} L600 {{prof.devzChart.thresh}}" stroke="#F2A93B" stroke-dasharray="5 4" vector-effect="non-scaling-stroke" fill="none"></path><path d="{{prof.devzChart.area}}" fill="#8B5CF6" fill-opacity="0.12"></path><path d="{{prof.devzChart.path}}" fill="none" stroke="#8B5CF6" stroke-width="1.8" vector-effect="non-scaling-stroke"></path></svg></div><div class="chart-x"><span>{{prof.first}}</span><span>dashed = 3 SD</span><span>{{prof.last}}</span></div></div></section>
              </div>
            </sc-if>
            <sc-if value="{{prof.noBaseline}}" hint-placeholder-val="{{false}}"><div class="card empty">Baseline unavailable — no activity history exists yet for this employee. SYNAPSE will not draw conclusions until enough history is collected.</div></sc-if>
          </sc-if>

          <sc-if value="{{pt.risk}}" hint-placeholder-val="{{false}}">
            <section class="card"><div class="card-h"><h2>Risk timeline</h2><span class="tiny muted">Alert scores across the 30-day window · click a marker for details</span></div>
              <div class="card-b"><div style="position: relative; height: 140px; border-left: 1px solid #22304D; border-bottom: 1px solid #22304D; margin-left: 26px; background: linear-gradient(#3A1622 0 15%, #3A2016 15% 30%, #3A2C12 30% 55%, #121B30 55%)">
                <sc-for list="{{prof.riskDots}}" as="d" hint-placeholder-count="2"><button type="button" title="{{d.tip}}" aria-label="{{d.tip}}" onClick="{{d.go}}" style="position: absolute; left: {{d.left}}%; bottom: {{d.bottom}}%; width: 14px; height: 14px; margin: 0 0 -7px -7px; border-radius: 50%; border: 2px solid #fff; background: {{d.c}}; cursor: pointer; padding: 0"></button></sc-for>
                <span class="tiny mono muted" style="position: absolute; left: -26px; top: -6px">100</span><span class="tiny mono muted" style="position: absolute; left: -16px; bottom: -6px">0</span>
              </div><div class="chart-x" style="margin-left: 26px"><span>{{prof.first}}</span><span>{{prof.last}}</span></div></div>
            </section>
            <div class="table-wrap"><table class="t"><thead><tr><th>Alert</th><th>Date</th><th>Activity</th><th>Severity</th><th>Explanation</th><th>Status</th><th>Outcome</th></tr></thead><tbody>
              <sc-for list="{{prof.risk}}" as="a" hint-placeholder-count="3"><tr><td><button type="button" class="link mono" onClick="{{a.go}}">{{a.id}}</button></td><td class="mono">{{a.whenShort}}</td><td>{{a.catLabel}}</td><td><span class="{{a.sevCls}}">{{a.sev}} · {{a.score}}</span></td><td>{{a.reason}}</td><td><span class="{{a.statusCls}}">{{a.status}}</span></td><td><span class="{{a.classCls}}">{{a.classification}}</span></td></tr></sc-for>
            </tbody></table><sc-if value="{{prof.noRisk}}" hint-placeholder-val="{{false}}"><div class="empty">No alerts recorded for this employee.</div></sc-if></div>
          </sc-if>

          <sc-if value="{{pt.devices}}" hint-placeholder-val="{{false}}">
            <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr))">
              
              <section class="card card-b" style="padding: 16px"><h2 style="margin-bottom: 10px">Approved and observed removable devices</h2><sc-for list="{{prof.removables}}" as="r" hint-placeholder-count="1"><div class="row small" style="justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #1C2740"><span>{{r.label}} <span class="mono tiny muted">{{r.serial}}</span></span><span class="{{r.cls}}">{{r.approved}}</span></div></sc-for></section>
              <section class="card card-b" style="padding: 16px"><h2 style="margin-bottom: 10px">Resource connections</h2><sc-for list="{{prof.resources}}" as="r" hint-placeholder-count="2"><div class="small" style="padding: 4px 0">{{r.label}} <span class="mono tiny muted">{{r.sub}}</span></div></sc-for><button type="button" class="btn btn-secondary btn-sm" style="margin-top: 10px" onClick="{{prof.graph}}">Open in Graph Explorer</button></section>
              <section class="card card-b" style="padding: 16px"><h2 style="margin-bottom: 10px">Organizational context &amp; policies</h2><sc-for list="{{prof.policies}}" as="p" hint-placeholder-count="3"><div class="row small" style="justify-content: space-between; padding: 4px 0"><span><span class="mono muted">{{p.id}}</span> {{p.name}}</span><span class="tiny muted">{{p.acked}}</span></div></sc-for></section>
            </div>
          </sc-if>

          <sc-if value="{{pt.interventions}}" hint-placeholder-val="{{false}}">
            <div class="grid" style="grid-template-columns: minmax(0, 240px) minmax(0, 1fr); gap: 14px">
              <section class="card card-b" style="padding: 16px; text-align: center"><div class="lbl">Awareness progress</div><div class="kpi-v" style="font-size: 34px; margin: 8px 0">{{prof.awareness}}%</div><div class="tiny muted">{{prof.awDone}} of {{prof.awTotal}} interventions completed. Completion is tracked for follow-up; it is not treated as reduced risk.</div></section>
              <div class="table-wrap"><table class="t"><thead><tr><th>ID</th><th>Type</th><th>Item</th><th>Assigned</th><th>Due</th><th>Status</th><th>Progress</th><th>Follow-up</th></tr></thead><tbody>
                <sc-for list="{{prof.ints}}" as="i" hint-placeholder-count="2"><tr><td class="mono">{{i.id}}</td><td>{{i.type}}</td><td>{{i.label}}</td><td class="mono">{{i.assigned}}</td><td class="mono">{{i.due}}</td><td><span class="{{i.cls}}">{{i.status}}</span></td><td class="mono">{{i.progress}}%</td><td class="small">{{i.followUp}}</td></tr></sc-for>
              </tbody></table><sc-if value="{{prof.noInts}}" hint-placeholder-val="{{false}}"><div class="empty">No interventions assigned.</div></sc-if></div>
            </div>
          </sc-if>
        </sc-if>

        
        <div class="page-h" style="display: {{peopleDirDisplay}}">
          <div><h1>People &amp; Behavior</h1><div class="page-sub">Employee directory with device, agent and investigation context. Open a profile to see personal baselines and intervention history.</div></div>
        </div>
        <div class="row" style="display: {{peopleDirDisplay}}"><div class="field" style="flex: 1; min-width: 220px"><label for="p-q">Search employees</label><input id="p-q" class="input" value="{{ui.pq}}" onChange="{{pf.q}}" placeholder="Name, ID or role"></div><div class="field" style="width: 220px"><label for="p-dept">Department</label><select id="p-dept" class="select" value="{{ui.pDept}}" onChange="{{pf.dept}}"><option value="All">All departments</option><sc-for list="{{depts}}" as="o" hint-placeholder-count="5"><option value="{{o.v}}">{{o.v}}</option></sc-for></select></div></div>
        <div class="table-wrap" style="display: {{peopleDirDisplay}}"><table class="t"><thead><tr><th>Employee</th><th>ID</th><th>Department</th><th>Job role</th><th>Approved devices</th><th>Agent</th><th>Recent activity</th><th>Open alerts</th><th>Investigation status</th></tr></thead><tbody>
          <sc-for list="{{peopleRows}}" as="e" hint-placeholder-count="8"><tr><td><button type="button" class="link row" onClick="{{e.go}}" style="gap: 8px; flex-wrap: nowrap"><span class="avatar" style="width: 28px; height: 28px; font-size: 11px">{{e.initials}}</span>{{e.name}}</button></td><td class="mono">{{e.id}}</td><td>{{e.dept}}</td><td>{{e.role}}</td><td class="small"><span class="mono">{{e.devices}}</span><br><span class="tiny muted">{{e.rmCount}} approved removable</span></td><td><span class="row small" style="gap: 6px; flex-wrap: nowrap"><span class="{{e.agentCls}}"></span>{{e.agent}}</span></td><td class="small">{{e.recent}}</td><td class="mono">{{e.open}}</td><td class="small">{{e.inv}}</td></tr></sc-for>
        </tbody></table><sc-if value="{{peopleEmpty}}" hint-placeholder-val="{{false}}"><div class="empty">No employees match.</div></sc-if></div>
      </sc-if>

      <!-- ================= BEHAVIORAL INTELLIGENCE ================= -->
      <sc-if value="{{p.behavior}}" hint-placeholder-val="{{false}}">
        <div class="page-h">
          <div><h1>Behavioral Intelligence</h1><div class="page-sub">Explore one employee’s observed activity against their own expected range. Click any point to inspect the underlying day, open related alerts or move to an investigation.</div></div>
          <span class="tag-sim">Simulated demonstration events</span>
        </div>
        <div class="card card-b" style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; padding: 14px">
          <div class="field" style="min-width: 240px; flex: 1"><label for="b-emp">Employee</label><select id="b-emp" class="select" value="{{ui.bEmp}}" onChange="{{bf.emp}}"><sc-for list="{{bEmpOpts}}" as="o" hint-placeholder-count="5"><option value="{{o.v}}">{{o.l}}</option></sc-for></select></div>
          <div class="field" style="width: 170px"><label for="b-metric">Measure</label><select id="b-metric" class="select" value="{{ui.bMetric}}" onChange="{{bf.metric}}"><option value="n">Daily events</option><option value="off">Off-hours events</option></select></div>
          <div class="field" style="width: 150px"><label for="b-range">Time range</label><select id="b-range" class="select" value="{{ui.bRange}}" onChange="{{bf.range}}"><option value="7">Last 7 days</option><option value="14">Last 14 days</option><option value="30">Last 30 days</option></select></div>
          <label class="switch"><input type="checkbox" checked="{{ui.bOverlay}}" onChange="{{bf.overlay}}"> <span class="small" style="font-weight: 600">Baseline overlay</span></label>
        </div>
        <div class="row" role="group" aria-label="Activity category" style="gap: 0"><sc-for list="{{bCatTabs}}" as="c" hint-placeholder-count="5"><button type="button" class="{{c.cls}}" aria-pressed="{{c.pressed}}" onClick="{{c.go}}">{{c.label}}</button></sc-for></div>
        <sc-if value="{{bHas}}" hint-placeholder-val="{{true}}">
          <div class="grid" style="grid-template-columns: minmax(0, 1fr) minmax(260px, 320px); align-items: start">
            <section class="card">
              <div class="card-h"><h2>{{bEmpName}} · observed versus expected</h2><span class="legend"><span><i class="lg-sw" style="background: #12394A"></i>Expected range</span><span><i class="lg-sw" style="background: #F2A93B"></i>&gt; 3 SD</span><span><i class="lg-sw" style="background: #F0506E"></i>Alert raised</span></span></div>
              <div class="card-b">
                <div class="chart-wrap"><div class="chart" style="height: 260px">
                  <sc-for list="{{bChart.ticks}}" as="t" hint-placeholder-count="3"><span class="chart-yt" style="top: {{t.top}}%">{{t.label}}</span></sc-for>
                  <svg viewBox="0 0 600 200" preserveAspectRatio="none" aria-hidden="true">
                    <path d="{{bChart.bandPath}}" fill="#22D3EE" fill-opacity="{{bChart.bandOp}}"></path>
                    <path d="{{bChart.meanPath}}" stroke="#22D3EE" stroke-opacity="{{bChart.meanOp}}" stroke-dasharray="5 4" stroke-width="1.2" vector-effect="non-scaling-stroke" fill="none"></path>
                    <path d="{{bChart.path}}" fill="none" stroke="#E6ECF5" stroke-width="2" vector-effect="non-scaling-stroke"></path>
                  </svg>
                  <sc-for list="{{bChart.pts}}" as="pt" hint-placeholder-count="30"><button type="button" class="{{pt.cls}}" style="left: {{pt.left}}%; top: {{pt.top}}%" title="{{pt.tip}}" aria-label="{{pt.tip}}" onClick="{{pt.go}}"></button></sc-for>
                </div></div>
                <div class="chart-x" style="padding-left: 34px"><span>{{bChart.first}}</span><span>{{bChart.mid}}</span><span>{{bChart.last}}</span></div>
                <div class="banner banner-info" style="margin-top: 12px">{{bStats.label}}. Expected range = personal mean {{bStats.mean}} ± 2 × SD {{bStats.sd}} (upper {{bStats.hi}}). {{bStats.above}} day(s) in range exceed it. Exceeding the range is an indicator for review, never a verdict.</div>
              </div>
            </section>
            <aside class="stack">
              <sc-if value="{{bPointShow}}" hint-placeholder-val="{{false}}">
                <section class="card card-b" style="padding: 16px">
                  <div class="row" style="justify-content: space-between"><h3>{{bPt.day}}</h3><button type="button" class="btn btn-ghost btn-sm" onClick="{{bPt.clear}}" aria-label="Close day details">✕</button></div>
                  <table class="t" style="margin-top: 8px"><thead><tr><th>Source</th><th>Events</th><th>Off</th><th>Dev.</th></tr></thead><tbody><sc-for list="{{bPt.rows}}" as="r" hint-placeholder-count="5"><tr><td class="small">{{r.label}}</td><td class="mono">{{r.n}}</td><td class="mono">{{r.off}}</td><td><span class="{{r.cls}}">{{r.z}}</span></td></tr></sc-for></tbody></table>

              <div class="table-wrap"><table class="t"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>
                <sc-for list="{{adUsers}}" as="x" hint-placeholder-count="3"><tr><td>{{x.name}}</td><td class="mono small">{{x.email}}</td><td>{{x.role}}</td><td><span class="{{x.cls}}">{{x.status}}</span></td><td><button type="button" class="btn btn-ghost btn-sm" onClick="{{x.toggle}}">{{x.toggleLabel}}</button></td></tr></sc-for>
              </tbody></table></div>
              <h2>Roles and permissions</h2>
              <div class="table-wrap"><table class="t"><thead><tr><th>Permission</th><th>Administrator</th><th>Security Analyst</th><th>Employee</th></tr></thead><tbody>
                <sc-for list="{{perm}}" as="r" hint-placeholder-count="6"><tr><td>{{r.label}}</td><td class="mono">{{r.a}}</td><td class="mono">{{r.s}}</td><td class="mono">{{r.e}}</td></tr></sc-for>
              </tbody></table></div>
              <div class="banner banner-info">Role checks in this prototype run in the browser. Production authorization must be enforced by the backend API gateway.</div>
            </sc-if>
            <sc-if value="{{adt.org}}" hint-placeholder-val="{{false}}">
              <h2>Departments &amp; job roles</h2>
              <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr))">
                <section class="card card-b" style="padding: 16px"><h3>Add department</h3><div class="row" style="margin-top: 10px; flex-wrap: nowrap"><input class="input" aria-label="Department name" value="{{ui.deptName}}" onChange="{{adOrg.dept}}" placeholder="e.g. Procurement"><button type="button" class="btn btn-primary" onClick="{{adOrg.addDept}}">Add</button></div></section>
                <section class="card card-b" style="padding: 16px"><h3>Add job role</h3><div class="stack" style="gap: 8px; margin-top: 10px"><input class="input" aria-label="Job role name" value="{{ui.roleName}}" onChange="{{adOrg.role}}" placeholder="e.g. Procurement Officer"><div class="row" style="flex-wrap: nowrap"><select class="select" aria-label="Department for role" value="{{ui.roleDept}}" onChange="{{adOrg.roleDept}}"><sc-for list="{{depts}}" as="o" hint-placeholder-count="5"><option value="{{o.v}}">{{o.v}}</option></sc-for></select><button type="button" class="btn btn-primary" onClick="{{adOrg.addRole}}">Add</button></div></div></section>
              </div>
              <div class="table-wrap"><table class="t"><thead><tr><th>Department</th><th>Employees</th><th>Job roles</th></tr></thead><tbody><sc-for list="{{depts}}" as="d" hint-placeholder-count="7"><tr><td>{{d.v}}</td><td class="mono">{{d.n}}</td><td class="small">{{d.roles}}</td></tr></sc-for></tbody></table></div>
            </sc-if>
            <sc-if value="{{adt.devices}}" hint-placeholder-val="{{false}}">
              <h2>Approved removable devices</h2>
              <section class="card card-b" style="padding: 16px">
                <h3>Register an approved device</h3>
                <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-top: 10px; align-items: end">
                  <div class="field"><label for="rm-l">Device label</label><input id="rm-l" class="input" value="{{ui.rmForm.label}}" onChange="{{rmf.label}}" placeholder="e.g. Kingston IronKey"></div>
                  <div class="field"><label for="rm-s">Serial</label><input id="rm-s" class="input" value="{{ui.rmForm.serial}}" onChange="{{rmf.serial}}" placeholder="e.g. KIK-90011"></div>
                  <div class="field"><label for="rm-e">Assigned employee</label><select id="rm-e" class="select" value="{{ui.rmForm.emp}}" onChange="{{rmf.emp}}"><sc-for list="{{employeesOpt}}" as="o" hint-placeholder-count="5"><option value="{{o.id}}">{{o.name}}</option></sc-for></select></div>
                  <button type="button" class="btn btn-primary" onClick="{{rmf.save}}">Register device</button>
                </div>
                <sc-if value="{{hasRmErr}}" hint-placeholder-val="{{false}}"><span class="errtext">{{rmErr}}</span></sc-if>
              </section>
              <div class="table-wrap"><table class="t"><thead><tr><th>ID</th><th>Device</th><th>Serial</th><th>Employee</th><th>Status</th><th>Added</th><th></th></tr></thead><tbody>
                <sc-for list="{{adRm}}" as="r" hint-placeholder-count="4"><tr><td class="mono">{{r.id}}</td><td>{{r.label}}</td><td class="mono small">{{r.serial}}</td><td>{{r.emp}}</td><td><span class="{{r.cls}}">{{r.approved}}</span></td><td class="mono small">{{r.added}}</td><td><button type="button" class="btn btn-ghost btn-sm" onClick="{{r.toggle}}">{{r.toggleLabel}}</button></td></tr></sc-for>
              </tbody></table></div>
              <h2>Registered endpoints</h2>
              <div class="table-wrap"><table class="t"><thead><tr><th>ID</th><th>Device</th><th>Employee</th><th>Status</th></tr></thead><tbody><sc-for list="{{adEps}}" as="e" hint-placeholder-count="5"><tr><td class="mono">{{e.id}}</td><td class="mono">{{e.name}}</td><td>{{e.emp}}</td><td>{{e.status}}</td></tr></sc-for></tbody></table></div>
              <p class="tiny muted" style="margin: 0">Register new endpoints and configure integrations from Data Sources &amp; Agents. Policy settings live in Security Policies.</p>
            </sc-if>
            <sc-if value="{{adt.notify}}" hint-placeholder-val="{{false}}">
              <h2>Notification preferences</h2>
              <section class="card card-b" style="padding: 8px 16px"><sc-for list="{{notif}}" as="n" hint-placeholder-count="4"><label class="switch" style="border-bottom: 1px solid #1C2740"><input type="checkbox" checked="{{n.on}}" onChange="{{n.toggle}}"><span class="small">{{n.label}}</span></label></sc-for></section>
              <p class="tiny muted" style="margin: 0">Notifications are not sent from this prototype; preferences are stored for the planned real-time alert service.</p>
            </sc-if>
            <sc-if value="{{adt.orginfo}}" hint-placeholder-val="{{false}}">
              <h2>Organization information</h2>
              <section class="card card-b grid" style="padding: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px">
                <div class="field"><label for="o-n">Organization name</label><input id="o-n" class="input" value="{{orgf.name}}" onChange="{{orgSet.name}}"></div>
                <div class="field"><label for="o-tz">Time zone</label><input id="o-tz" class="input" value="{{orgf.timezone}}" onChange="{{orgSet.timezone}}"></div>
                <div class="field"><label for="o-r">Data retention</label><select id="o-r" class="select" value="{{orgf.retention}}" onChange="{{orgSet.retention}}"><option value="90 days">90 days</option><option value="180 days">180 days</option><option value="365 days">365 days</option></select></div>
                <div class="field"><label for="o-s">Off-hours start</label><input id="o-s" class="input" value="{{orgf.offStart}}" onChange="{{orgSet.offStart}}"></div>
                <div class="field"><label for="o-e">Off-hours end</label><input id="o-e" class="input" value="{{orgf.offEnd}}" onChange="{{orgSet.offEnd}}"></div>
                <div class="row" style="align-self: end"><button type="button" class="btn btn-primary" onClick="{{orgf.save}}">Save organization settings</button></div>
              </section>
            </sc-if>
            <sc-if value="{{adt.status}}" hint-placeholder-val="{{false}}">
              <h2>System status</h2>
              <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr))"><sc-for list="{{sysStatus}}" as="x" hint-placeholder-count="6"><section class="card card-b" style="padding: 14px"><div class="row" style="justify-content: space-between"><b class="small">{{x.name}}</b><span class="row small" style="gap: 6px"><span class="{{x.cls}}"></span>{{x.st}}</span></div><div class="tiny muted" style="margin-top: 6px">{{x.note}}</div></section></sc-for></div>
            </sc-if>
            <sc-if value="{{adt.account}}" hint-placeholder-val="{{false}}">
              <h2>Account settings</h2>
              <section class="card card-b" style="padding: 16px"><dl class="kv" style="margin: 0"><dt>Name</dt><dd>{{me.name}}</dd><dt>Role</dt><dd>{{me.title}}</dd><dt>Authentication</dt><dd>Simulated demo login. Password changes and MFA will be handled by the organization’s identity provider in production.</dd></dl>
                <div class="row" style="margin-top: 14px"><button type="button" class="btn btn-secondary" onClick="{{h.logout}}">Sign out</button></div></section>
            </sc-if>
          </div>
        </div>
      </sc-if>
    </main>
  </div>
</div>

<!-- ============ ALERT DRAWER ============ -->
<sc-if value="{{drawer.show}}" hint-placeholder-val="{{false}}">
  <div class="scrim" onClick="{{h.closeDrawer}}"></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-label="Alert details">
    <div class="drawer-h"><span class="mono" style="font-weight: 600">{{drawer.id}}</span><span class="{{drawer.sevCls}}">{{drawer.sev}} · {{drawer.score}}</span><span class="{{drawer.statusCls}}">{{drawer.status}}</span><button type="button" class="btn btn-ghost btn-sm" style="margin-left: auto" onClick="{{h.closeDrawer}}" aria-label="Close alert details">✕ Close</button></div>
    <div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 14px">
      <section class="card card-b" style="padding: 16px"><h2>{{drawer.reason}}</h2><div class="small muted" style="margin-top: 4px">{{drawer.when}} · {{drawer.catLabel}} · {{drawer.model}}</div>
        <div class="scorebar" style="margin: 14px 0 4px"><span class="scorepin" style="left: {{drawer.scoreW}}%"></span></div><div class="tiny muted">Anomaly score {{drawer.score}}/100 (simulated). Indicates deviation from the employee’s baseline — not a probability of malicious intent.</div></section>
      <section class="card card-b" style="padding: 16px"><h3 style="margin-bottom: 8px">Employee</h3><dl class="kv" style="margin: 0"><dt>Name</dt><dd>{{drawer.empName}}</dd><dt>Department · role</dt><dd>{{drawer.dept}} · {{drawer.role}}</dd><dt>Devices</dt><dd>{{drawer.devices}}</dd><dt>Removable devices</dt><dd>{{drawer.rms}}</dd><dt>Baseline</dt><dd>{{drawer.baselineLabel}}</dd><dt>Classification</dt><dd><span class="{{drawer.classCls}}">{{drawer.classification}}</span></dd><dt>Assigned analyst</dt><dd>{{drawer.analystName}}</dd></dl></section>
      <section class="card card-b" style="padding: 16px"><h3 style="margin-bottom: 8px">Behavioral deviation &amp; baseline comparison</h3>
        <sc-if value="{{drawer.hasFeatures}}" hint-placeholder-val="{{true}}"><table class="t"><thead><tr><th>Feature</th><th>Observed</th><th>Personal mean</th><th>Deviation</th></tr></thead><tbody><sc-for list="{{drawer.features}}" as="f" hint-placeholder-count="4"><tr><td>{{f.label}}</td><td class="mono">{{f.value}}</td><td class="mono">{{f.mean}}</td><td><span class="zchip z-mid">{{f.zLabel}}</span></td></tr></sc-for></tbody></table></sc-if>
      </section>
      <sc-if value="{{drawer.hasContext}}" hint-placeholder-val="{{false}}"><section class="card card-b" style="padding: 16px"><h3 style="margin-bottom: 8px">Organizational context</h3><div class="stack" style="gap: 6px"><sc-for list="{{drawer.context}}" as="c" hint-placeholder-count="2"><div class="banner banner-info">{{c}}</div></sc-for></div></section></sc-if>
      <section class="card card-b" style="padding: 16px"><h3 style="margin-bottom: 8px">Triggering activity &amp; associated events</h3><div class="tl"><sc-for list="{{drawer.events}}" as="e" hint-placeholder-count="3"><div class="tl-item"><span class="mono">{{e.t}}</span><span class="{{e.srcCls}}">{{e.src}}</span><span>{{e.detail}}</span></div></sc-for></div></section>
      <section class="card card-b" style="padding: 16px"><h3 style="margin-bottom: 8px">Applicable policies</h3><sc-for list="{{drawer.policies}}" as="p" hint-placeholder-count="2"><div class="small"><span class="mono muted">{{p.id}}</span> {{p.name}}</div></sc-for><p class="tiny muted" style="margin: 6px 0 0">Policy matches are indicators, not proof.</p></section>
      <section class="card card-b" style="padding: 16px"><h3 style="margin-bottom: 8px">Investigation history</h3><div class="stack" style="gap: 5px"><sc-for list="{{drawer.historyV}}" as="hh" hint-placeholder-count="3"><div class="small"><span class="mono tiny muted">{{hh.when}}</span> · <b>{{hh.user}}</b> — {{hh.action}}</div></sc-for></div></section>
      <section class="card card-b" style="padding: 16px; display: flex; flex-direction: column; gap: 10px"><h3>Analyst actions</h3>
        <sc-if value="{{isAnalyst}}" hint-placeholder-val="{{true}}">
          <div class="row" style="align-items: flex-end"><div class="field" style="width: 200px"><label for="dr-as">Assign analyst</label><select id="dr-as" class="select" value="{{drawer.analyst}}" onChange="{{drawer.act.assign}}"><option value="">Unassigned</option><sc-for list="{{analysts}}" as="o" hint-placeholder-count="2"><option value="{{o.id}}">{{o.name}}</option></sc-for></select></div><div class="field" style="width: 220px"><label for="dr-st">Update status</label><select id="dr-st" class="select" value="{{drawer.status}}" onChange="{{drawer.act.status}}"><sc-for list="{{statusOpts}}" as="o" hint-placeholder-count="5"><option value="{{o.v}}">{{o.v}}</option></sc-for></select></div></div>
        </sc-if>
        <div class="row"><button type="button" class="btn btn-primary" onClick="{{drawer.act.workspace}}">Open in Investigation Workspace</button><button type="button" class="btn btn-secondary" onClick="{{drawer.act.profile}}">Employee profile</button><button type="button" class="btn btn-secondary" onClick="{{drawer.act.behavior}}">Behavioral view</button></div>
      </section>
    </div>
  </aside>
</sc-if>
</sc-if>

<!-- ================= EMPLOYEE PORTAL ================= -->
<sc-if value="{{isEmp}}" hint-placeholder-val="{{false}}">
<div class="eshell">
  <header class="etop">
    <div class="row" style="gap: 10px"><img src="{{mark}}" alt="SYNAPSE" style="width: 34px; height: 34px; border-radius: 8px"><div><div class="brand-name" style="font-size: 14px">SYNAPSE</div><div class="brand-tag">My Security Awareness</div></div></div>
    <span class="tag-sim" style="background: #2A2147; color: #CBBDF2">Demo</span>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 10px"><span class="avatar" style="background: #1C2A47; color: #DDF4F6">{{me.initials}}</span><span style="line-height: 1.2"><b style="font-size: 13px">{{me.name}}</b><br><span class="tiny" style="color: #9FB0C2">{{me.title}}</span></span><button type="button" class="btn btn-sm" style="background: #1C2A47; color: #fff" onClick="{{h.logout}}">Sign out</button></div>
  </header>
  <div class="employee-layout">
  <nav class="employee-sidebar" aria-label="Employee portal navigation">
    <div class="employee-side-label">MY WORKSPACE</div>
    <sc-for list="{{enav}}" as="n" hint-placeholder-count="7"><button type="button" class="{{n.cls}}" aria-current="{{n.current}}" onClick="{{n.go}}"><span class="employee-nav-dot" aria-hidden="true"></span><span class="employee-nav-label">{{n.label}}</span><sc-if value="{{n.hasBadge}}" hint-placeholder-val="{{false}}"><span class="nav-badge">{{n.badge}}</span></sc-if></button></sc-for>
    <div class="employee-sidebar-foot"><span class="tiny muted">Security awareness · Employee portal</span></div>
  </nav>
  <main class="econtent">
    <div class="crumbs" aria-label="Breadcrumb"><span>My portal</span><span aria-hidden="true">/</span><b>{{ePageTitle}}</b></div>

    <sc-if value="{{ep.home}}" hint-placeholder-val="{{true}}">
      <section class="ecard" style="display: flex; gap: 20px; align-items: center; flex-wrap: wrap">
        <div style="flex: 1; min-width: 260px"><h1>Welcome back, {{ehome.first}}</h1><p class="muted" style="margin: 6px 0 0">Here is what needs your attention. Security awareness activities help everyone stay safe — reporting a false alarm is always welcome.</p></div>
        <div class="row" style="gap: 14px"><div class="ring" style="{{ehome.ring}}"><div class="ring-in">{{ehome.pct}}%<span class="tiny muted" style="font-family: Inter, sans-serif; font-weight: 500">complete</span></div></div><div class="small"><b>{{ehome.done}} of {{ehome.total}}</b> awareness activities<br><span class="muted">completed this cycle</span></div></div>
      </section>
      <sc-if value="{{ehome.allClear}}" hint-placeholder-val="{{false}}"><div class="ecard" style="text-align: center"><h2>You’re all caught up</h2><p class="muted small" style="margin: 6px 0 0">No pending training, assessments, acknowledgments or verification requests.</p></div></sc-if>
      <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr))">
        <section class="ecard">
          <h2>Action needed</h2>
          <div style="margin-top: 6px">
            <sc-for list="{{ehome.verifs}}" as="v" hint-placeholder-count="1"><div class="action-row"><span class="pill pill-violet">Verification</span><div style="flex: 1; min-width: 180px"><b class="small">Request {{v.id}}</b><div class="tiny muted">{{v.when}}</div></div><button type="button" class="btn btn-violet btn-sm" onClick="{{v.go}}">Respond to verification</button></div></sc-for>
            <sc-for list="{{ehome.training}}" as="t" hint-placeholder-count="1"><div class="action-row"><span class="pill pill-cyan">Training</span><div style="flex: 1; min-width: 180px"><b class="small">{{t.title}}</b><div class="prog" style="margin: 4px 0"><div style="width: {{t.progress}}%"></div></div><span class="{{t.dueCls}}">Due {{t.due}}</span></div><button type="button" class="btn btn-primary btn-sm" onClick="{{t.go}}">Continue training</button></div></sc-for>
            <sc-for list="{{ehome.assess}}" as="a" hint-placeholder-count="1"><div class="action-row"><span class="pill pill-warn">Assessment</span><div style="flex: 1; min-width: 180px"><b class="small">{{a.title}}</b><div class="{{a.dueCls}}">Due {{a.due}}</div></div><button type="button" class="btn btn-secondary btn-sm" onClick="{{a.go}}">Start assessment</button></div></sc-for>
            <sc-for list="{{ehome.policies}}" as="p" hint-placeholder-count="1"><div class="action-row"><span class="pill pill-idle">Policy</span><div style="flex: 1; min-width: 180px"><b class="small">{{p.title}}</b><div class="{{p.dueCls}}">Acknowledge by {{p.due}}</div></div><button type="button" class="btn btn-secondary btn-sm" onClick="{{p.go}}">Review policy</button></div></sc-for>
            <sc-for list="{{ehome.phish}}" as="p" hint-placeholder-count="1"><div class="action-row"><span class="pill pill-ok">Exercise</span><div style="flex: 1; min-width: 180px"><b class="small">Phishing-recognition exercise</b><div class="due">Due {{p.due}}</div></div><button type="button" class="btn btn-secondary btn-sm" onClick="{{p.go}}">Start exercise</button></div></sc-for>
          </div>
        </section>
        <section class="ecard">
          <h2>Upcoming deadlines</h2>
          <div class="stack" style="gap: 8px; margin-top: 10px"><sc-for list="{{ehome.deadlines}}" as="d" hint-placeholder-count="3"><div class="row small" style="justify-content: space-between; flex-wrap: nowrap"><span>{{d.title}} <span class="tiny muted">· {{d.type}}</span></span><span class="{{d.dueCls}}">{{d.dueL}}</span></div></sc-for></div>
          <h2 style="margin-top: 20px">Recent notifications</h2>
          <div class="stack" style="gap: 8px; margin-top: 10px"><sc-for list="{{ehome.notes}}" as="n" hint-placeholder-count="3"><div class="small"><span class="tiny muted mono">{{n.when}}</span><div>{{n.text}}</div></div></sc-for></div>
          <button type="button" class="link small" style="margin-top: 12px" onClick="{{eGo.history}}">View my activity history →</button>
        </section>
      </div>
      <p class="tiny muted" style="margin: 0">SYNAPSE is transparent: security monitoring covers work devices and accounts as described in company policy. Investigation records and analyst notes are not shown here.</p>
    </sc-if>

    <sc-if value="{{ep.training}}" hint-placeholder-val="{{false}}">
      <sc-if value="{{tActive}}" hint-placeholder-val="{{false}}">
        <div class="row"><button type="button" class="btn btn-ghost btn-sm" onClick="{{tm.back}}">← All training</button></div>
        <div class="grid" style="grid-template-columns: minmax(200px, 260px) minmax(0, 1fr); align-items: start">
          <aside class="ecard" style="padding: 12px"><div class="lbl" style="padding: 4px 8px 8px">{{tm.title}}</div><sc-for list="{{tm.steps}}" as="s" hint-placeholder-count="5"><button type="button" class="{{s.cls}}" onClick="{{s.go}}"><span class="tstep-n">{{s.n}}</span>{{s.h}}</button></sc-for><div class="prog" style="margin: 12px 8px 4px"><div style="width: {{tm.pct}}%"></div></div><div class="tiny muted" style="padding: 0 8px">{{tm.pct}}% complete</div></aside>
          <section class="ecard" style="display: flex; flex-direction: column; gap: 14px; min-height: 360px">
            <div class="tiny muted">{{tm.stepLabel}}</div>
            <sc-if value="{{tm.onQuiz}}" hint-placeholder-val="{{false}}">
              <h2>Review questions</h2>
              <p class="small muted" style="margin: 0">Answer every question, then check your answers. You need at least {{tm.total}} sections reviewed and all but one answer correct to complete the module.</p>
              <sc-for list="{{tm.qs}}" as="q" hint-placeholder-count="3">
                <fieldset style="border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px"><legend class="small" style="font-weight: 600; margin-bottom: 8px">{{q.n}}. {{q.q}}</legend>
                  <sc-for list="{{q.opts}}" as="o" hint-placeholder-count="4"><label class="{{o.cls}}"><input type="radio" name="{{o.name}}" checked="{{o.checked}}" onChange="{{o.pick}}"><span class="small">{{o.o}}</span></label></sc-for>
                </fieldset>
              </sc-for>
              <sc-if value="{{tm.done}}" hint-placeholder-val="{{false}}"><div class="feedback fb-ok"><b>Module completed.</b> Your completion has been recorded and shared with the security team.</div></sc-if>
              <div class="row"><button type="button" class="btn btn-secondary" onClick="{{tm.prev}}">Back</button><button type="button" class="btn btn-primary" onClick="{{tm.check}}" disabled="{{tm.done}}">Check answers &amp; complete</button></div>
            </sc-if>
            <sc-if value="{{tm.sec}}" hint-placeholder-val="{{true}}">
              <h2 style="font-size: 20px">{{tm.sec.h}}</h2>
              <p style="margin: 0; line-height: 1.65">{{tm.sec.p}}</p>
              <ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px"><sc-for list="{{tm.sec.pts}}" as="p" hint-placeholder-count="3"><li>{{p.p}}</li></sc-for></ul>
              <div class="row" style="margin-top: auto"><button type="button" class="btn btn-secondary" onClick="{{tm.prev}}" disabled="{{tm.prevDis}}">Previous</button><button type="button" class="btn btn-primary" onClick="{{tm.next}}">Next section</button></div>
            </sc-if>
          </section>
        </div>
      </sc-if>
      
      <div style="display: {{trListDisplay}}" class="stack">
        <h1>My Training</h1>
        <sc-if value="{{trEmpty}}" hint-placeholder-val="{{false}}"><div class="ecard empty">No training assigned right now.</div></sc-if>
        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr))">
          <sc-for list="{{trCards}}" as="t" hint-placeholder-count="2">
            <section class="ecard" style="display: flex; flex-direction: column; gap: 10px">
              <div class="row" style="justify-content: space-between; flex-wrap: nowrap; align-items: flex-start"><h2>{{t.title}}</h2><span class="{{t.cls}}">{{t.status}}</span></div>
              <p class="small muted" style="margin: 0">{{t.desc}}</p>
              <div class="tiny muted">About {{t.mins}} minutes · assigned {{t.assigned}} · <span class="{{t.dueCls}}">due {{t.due}}</span></div>
              <div class="prog"><div style="{{t.pw}}"></div></div><div class="tiny muted">{{t.progress}}% complete</div>
              <button type="button" class="btn btn-primary" style="align-self: flex-start" onClick="{{t.go}}">{{t.btn}}</button>
            </section>
          </sc-for>
        </div>
      </div>

<script>
(function(){
  var SVGNS='http://www.w3.org/2000/svg';
  var src=document.getElementById('dc-template').textContent;
  src=src.replace(/<sc-(if|for)\b/g,'<template data-sc="$1"').replace(/<\/sc-(if|for)>/g,'</template>');
  var tpl=document.createElement('template'); tpl.innerHTML=src;
  var root=document.getElementById('app');
  function lookup(scopes,path){
    path=path.trim();
    if(path==='true')return true; if(path==='false')return false; if(path==='null')return null;
    if(/^-?\d+(\.\d+)?$/.test(path))return +path;
    if(/^'.*'$|^".*"$/.test(path))return path.slice(1,-1);
    var parts=path.split('.'), v, i;
    for(i=0;i<scopes.length;i++){ if(scopes[i]!=null && Object.prototype.hasOwnProperty.call(scopes[i],parts[0])){ v=scopes[i][parts[0]]; break; } }
    for(i=1;i<parts.length;i++){ if(v==null)return undefined; v=v[parts[i]]; }
    return v;
  }
  var WHOLE=/^\s*\{\{([^{}]+)\}\}\s*$/;
  function interp(s,scopes){ return s.replace(/\{\{([^{}]+)\}\}/g,function(m,p){ var v=lookup(scopes,p); return v==null?'':String(v); }); }
  function attrVal(s,scopes){ var m=s.match(WHOLE); return m?lookup(scopes,m[1]):interp(s,scopes); }
  function evName(attr,el){
    var n=attr.slice(2);
    if(n==='change'){ var t=(el.getAttribute('type')||'').toLowerCase(); var tag=el.localName;
      if(tag==='textarea' || (tag==='input' && ['checkbox','radio','file','range','date'].indexOf(t)<0)) return 'input'; return 'change'; }
    return n;
  }
  function renderNodes(parent,dst,scopes){ var c=parent.childNodes; for(var i=0;i<c.length;i++) renderNode(c[i],dst,scopes); }
  function renderNode(n,dst,scopes){
    if(n.nodeType===3){ var t=n.nodeValue; dst.appendChild(document.createTextNode(t.indexOf('{{')<0?t:interp(t,scopes))); return; }
    if(n.nodeType!==1) return;
    if(n.localName==='template' && n.getAttribute('data-sc')){
      var kind=n.getAttribute('data-sc');
      if(kind==='if'){ if(attrVal(n.getAttribute('value')||'',scopes)) renderNodes(n.content,dst,scopes); }
      else { var list=attrVal(n.getAttribute('list')||'',scopes)||[]; var as=n.getAttribute('as')||'item';
        for(var i=0;i<list.length;i++){ var sc={}; sc[as]=list[i]; sc.$index=i; renderNodes(n.content,dst,[sc].concat(scopes)); } }
      return;
    }
    var el=document.createElementNS(n.namespaceURI||'http://www.w3.org/1999/xhtml', n.localName);
    var deferredValue, hasValue=false, checked=null, events=[];
    for(var a=0;a<n.attributes.length;a++){
      var at=n.attributes[a], name=at.name, val=at.value;
      if(name.indexOf('hint-')===0) continue;
      if(/^on[a-z]+$/.test(name)){ var fn=attrVal(val,scopes); if(typeof fn==='function') events.push([name,fn]); continue; }
      var hasHole=val.indexOf('{{')>=0;
      var v=hasHole?attrVal(val,scopes):val;
      if(name==='value'){ hasValue=true; deferredValue=v; continue; }
      if(name==='checked'){ checked=!!v && v!=='false'; continue; }
      if(name==='disabled'||name==='readonly'){ if(v && v!=='false') el.setAttribute(name,''); continue; }
      if(v===false||v==null) continue;
      el.setAttribute(name,String(v));
    }
    events.forEach(function(e){ var fn=e[1]; el.addEventListener(evName(e[0],el),function(ev){ fn(ev); }); });

function rnd(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} h^=h>>>13; h=Math.imul(h,1274126177); h^=h>>>16; return (h>>>0)/4294967296; }
function dow(d){ return new Date(d+'T12:00:00Z').getUTCDay(); }
function pad(n){ return (n<10?'0':'')+n; }
function nowTs(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes()); }
function today(){ return nowTs().slice(0,10); }
function fD(s){ if(!s) return '—'; const p=s.slice(0,10).split('-'); return parseInt(p[2],10)+' '+MON[+p[1]-1]+' '+p[0]; }
function fTs(s){ if(!s) return '—'; const t=s.slice(11,16); return fD(s)+(t?', '+t:''); }
function fShort(d){ const p=d.split('-'); return parseInt(p[2],10)+' '+MON[+p[1]-1]; }
function addDays(d,n){ return new Date(Date.parse(d+'T12:00:00Z')+n*86400000).toISOString().slice(0,10); }
function initials(n){ return n.split(' ').map(x=>x[0]).slice(0,2).join(''); }

  const out = {};
  Object.keys(PROF).forEach(id=>{
    const p = PROF[id].prof, hired = PROF[id].hired;

        if (inj && inj[c.k]){ n = inj[c.k].n; off = inj[c.k].off; }
        row.c[c.k] = {n, off};
      });
      return row;
    });
  });

    const sd = Math.sqrt(xs.reduce((a,b)=>a+(b-mean)*(b-mean),0)/Math.max(1,xs.length)) || 1;
    pop[c.k+'_'+m] = {mean, sd};
  }); });
  const base = {};
  Object.keys(out).forEach(id=>{
    const tr = out[id].filter(r=>r.active && r.d<=TRAIN_END);
    const personal = tr.length >= 10;
    base[id] = {personal, trainDays: tr.length, f:{}};

function lineChart(vals, opts){
  opts = opts || {};
  const W=600, H=200, n=vals.length;
  const band = opts.band; // {lo, hi, mean}
  let max = Math.max.apply(null, vals.concat(band?[band.hi]:[]).concat([1]));
  max = max*1.12;
  const x = i => n<=1 ? W/2 : (i/(n-1))*W;
  const y = v => H - (Math.max(0,v)/max)*H;
  const path = vals.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  const area = path + ' L'+W+' '+H+' L0 '+H+' Z';
  let bandPath='', meanPath='';
  if (band){ const lo=Math.max(0,band.lo); bandPath='M0 '+y(band.hi).toFixed(1)+' L'+W+' '+y(band.hi).toFixed(1)+' L'+W+' '+y(lo).toFixed(1)+' L0 '+y(lo).toFixed(1)+' Z'; meanPath='M0 '+y(band.mean).toFixed(1)+' L'+W+' '+y(band.mean).toFixed(1); }
  const ticks = [0,0.5,1].map(f=>({label: String(Math.round(max/1.12*f)), top:(100-(f/1.12)*100).toFixed(1)}));
  return {path, area, bandPath, meanPath, ticks, x:(i)=>(n<=1?50:(i/(n-1))*100), y:(v)=>(100 - (Math.max(0,v)/max)*100)};
}

      yes:()=>this.phishAnswer(u.phIdx, true), no:()=>this.phishAnswer(u.phIdx, false), next:()=>this.ui({phIdx:Math.min(PHISH.length-1,u.phIdx+1)}), prev:()=>this.ui({phIdx:Math.max(0,u.phIdx-1)}), prevDis:u.phIdx===0, isLast:u.phIdx===PHISH.length-1, finish:()=>this.phishFinish(), done:u.phDone,
      canFinish: Object.keys(u.phAnswers).length===PHISH.length, restart:()=>this.ui({phIdx:0, phAnswers:{}, phDone:false}),
      score: PHISH.filter((p,i)=>u.phAnswers[i]===p.phish).length, history: myRuns.map(r=>({id:r.id, score:r.score+'/'+r.total, at:fTs(r.at)})), hasHistory: myRuns.length>0,
      fbCls: ans===ph.phish?'feedback fb-ok':'feedback fb-bad', yesCls:'btn '+(ans===true?'btn-primary':'btn-secondary'), noCls:'btn '+(ans===false?'btn-primary':'btn-secondary'),
      assigned: open.some(i=>i.ref==='PH-01')};

    // POLICIES
    const applicable = db.policies.filter(p=>p.enabled && (p.depts.indexOf('All departments')>=0||p.depts.indexOf(e.dept)>=0));
    V.epol = applicable.map(p=>{ const ack=db.acks.filter(a=>a.policy===p.id&&a.emp===eid).slice(-1)[0]; const req=open.find(i=>i.ref===p.id); return {id:p.id, name:p.name, cat:p.cat, updated:fD(p.updated), ack: ack?'Acknowledged '+fTs(ack.at):p.ack?(req?'Acknowledgment required · due '+fD(req.due):'Acknowledgment requested'):'For information', acked:!!ack, needs: p.ack&&!ack, cls:'pill '+(ack?'pill-ok':p.ack?'pill-warn':'pill-idle'), btn: ack?'View':p.ack?'Review & acknowledge':'Read', go:()=>this.ui({polRead:p.id, polAgree:false})}; });
    const pr = db.policies.find(p=>p.id===u.polRead); V.polReadShow = !!pr;
    if (pr){ const ack=db.acks.filter(a=>a.policy===pr.id&&a.emp===eid).slice(-1)[0]; V.pr = {id:pr.id, name:pr.name, cat:pr.cat, body:pr.body, updated:fD(pr.updated), acked:!!ack, ackAt: ack?fTs(ack.at):'', needs: pr.ack && !ack, agree:u.polAgree, setAgree:e=>this.ui({polAgree:e.target.checked}), ack:()=>this.ackPolicy(pr.id), back:()=>this.ui({polRead:'', polAgree:false}), ackDis: !u.polAgree}; }
    V.epolDone = db.acks.filter(a=>a.emp===eid).map(a=>({name:(db.policies.find(p=>p.id===a.policy)||{name:a.policy}).name, at:fTs(a.at)})).reverse();

    // VERIFICATION
    const vs = db.verifications.filter(v=>v.emp===eid);
    V.ev = vs.map(v=>({id:v.id, reason:v.reason, when:fTs(v.created), status:v.status, pending:!v.respondedAt, cls:'st '+(v.respondedAt?'st-completed':'st-pending'), responded:v.respondedAt?fTs(v.respondedAt):'', comment:v.comment, go:()=>this.ui({vSel:v.id, vChoice:'', vComment:'', vErr:''})}));
    V.evEmpty = vs.length===0;
    const vsel = vs.find(v=>v.id===u.vSel); V.vShow = !!vsel;
    if (vsel){ V.vr = {id:vsel.id, reason:vsel.reason, instructions:vsel.instructions, when:fTs(vsel.created), pending:!vsel.respondedAt, status:vsel.status, comment:vsel.comment, responded:fTs(vsel.respondedAt), err:u.vErr, hasErr:!!u.vErr, comm:u.vComment, back:()=>this.ui({vSel:''}), submit:()=>this.respondVerify(vsel.id), setComment:e=>this.ui({vComment:e.target.value, vErr:''}),
      choices:[['confirmed','Yes — this was me','I performed this activity for a legitimate work reason.'],['disputed','No — I don’t recognise this','I did not perform this activity.'],['unsure','I’m not sure','I need help from the security team.']].map(c=>({v:c[0], l:c[1], d:c[2], checked:u.vChoice===c[0], cls:'choice'+(u.vChoice===c[0]?' on':''), pick:()=>this.ui({vChoice:c[0], vErr:''})})), needComment: u.vChoice==='confirmed'}; }

    // HISTORY
    const hist=[];
    mine.forEach(i=>{ hist.push({ts:i.assigned+' 09:00', type:i.type, text:i.type+' assigned: '+this.refLabel(i.ref), cls:'hdot hdot-assign'}); if(i.status==='Completed') hist.push({ts:(i.completed||i.assigned)+' 17:00', type:i.type, text:i.type+' completed: '+this.refLabel(i.ref), cls:'hdot hdot-done'}); });
    subs.forEach(x=>hist.push({ts:x.at, type:'Assessment', text:'Assessment submitted: '+ASSESS[x.assess].title+' ('+x.score+'/'+x.total+')', cls:'hdot hdot-done'}));
    myRuns.forEach(x=>hist.push({ts:x.at, type:'Phishing exercise', text:'Phishing exercise result '+x.score+'/'+x.total, cls:'hdot hdot-done'}));
    db.acks.filter(a=>a.emp===eid).forEach(a=>hist.push({ts:a.at, type:'Policy', text:'Policy acknowledged: '+(db.policies.find(p=>p.id===a.policy)||{name:a.policy}).name, cls:'hdot hdot-done'}));
    vs.filter(v=>v.respondedAt).forEach(v=>hist.push({ts:v.respondedAt, type:'Verification', text:'Verification '+v.id+' answered: '+v.status, cls:'hdot hdot-done'}));
    V.hist = hist.sort((a,b)=>a.ts<b.ts?1:-1).map(h=>Object.assign(h,{when:fTs(h.ts)})); V.histEmpty = hist.length===0;

    // PROFILE
    const pf = u.profForm || {prefName:e.prefName||'', ext:e.ext||''};
    const np = (db.settings.empNotify[eid]) || {email:true, reminders:true, digest:false};
    V.eprof = {name:e.name, id:e.id, dept:e.dept, role:e.role, email:e.email, site:e.site, hired:fD(e.hired), prefName:pf.prefName, ext:pf.ext, dirty:!!u.profForm,
      devices: db.endpoints.filter(x=>x.emp===eid).map(x=>({name:x.name, os:x.os})).concat(db.removables.filter(r=>r.emp===eid&&r.approved).map(r=>({name:r.label, os:'Approved removable device'}))),
      setPref:e2=>{ const v=e2.target.value; this.ui(x=>({profForm:Object.assign({}, x.profForm||{prefName:e.prefName||'', ext:e.ext||''}, {prefName:v})})); },
      setExt:e2=>{ const v=e2.target.value.replace(/[^0-9]/g,'').slice(0,5); this.ui(x=>({profForm:Object.assign({}, x.profForm||{prefName:e.prefName||'', ext:e.ext||''}, {ext:v})})); },
      save:()=>{ this.mut((d,actor)=>{ const x=d.employees.find(y=>y.id===eid); x.prefName=pf.prefName.trim(); x.ext=pf.ext; this.audit(d, actor, 'Profile updated', eid); }, 'Profile saved'); this.ui({profForm:null}); },
      notif: [['email','Email me when something new is assigned'],['reminders','Send reminders 2 days before a due date'],['digest','Weekly summary of my awareness activities']].map(n=>({label:n[1], on:!!np[n[0]], toggle:()=>this.mut((d,actor)=>{ d.settings.empNotify[eid]=Object.assign({email:true,reminders:true,digest:false}, d.settings.empNotify[eid]||{}); d.settings.empNotify[eid][n[0]]=!d.settings.empNotify[eid][n[0]]; this.audit(d, actor, 'Notification preference changed', n[0]); }, 'Preference saved')}))};
    V.trListDisplay = V.tActive?'none':''; V.asListDisplay = V.aActive?'none':''; V.polListDisplay = V.polReadShow?'none':''; V.vListDisplay = V.vShow?'none':'';
    V.vrDoneDisplay = (V.vr && !V.vr.pending)?'':'none'; V.phFinishDis = !V.ph.canFinish || !!u.phDone; V.eprofSaveDis = !u.profForm;
  }
}


window.__mountDC(Component);
</script>
