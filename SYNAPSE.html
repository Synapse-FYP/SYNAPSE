<style>
body{margin:0;background:#0A1020;color:#E6ECF5;font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.45}
*{box-sizing:border-box}
a{color:#67E8F9}a:hover{color:#A5F3FC}
::selection{background:#8B5CF6;color:#fff}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid #A78BFA;outline-offset:2px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12.5px}
.muted{color:#93A3BC}.small{font-size:12.5px}.tiny{font-size:11.5px}
h1,h2,h3,h4{font-family:Sora,Inter,sans-serif;margin:0;color:#F4F7FB;letter-spacing:-0.015em}
h1{font-size:25px;font-weight:700}h2{font-size:15.5px;font-weight:600}h3{font-size:14px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 15px;border-radius:9px;border:1px solid transparent;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:filter .15s,background .15s,border-color .15s}
.btn-primary{background:linear-gradient(135deg,#0891B2,#7C3AED);color:#fff;box-shadow:0 6px 18px -8px rgba(124,58,237,.7)}.btn-primary:hover{filter:brightness(1.12);color:#fff}
.btn-secondary{background:#162138;border-color:#2B3A5C;color:#E6ECF5}.btn-secondary:hover{background:#1C2945;border-color:#3B4E78}
.btn-ghost{background:transparent;color:#C9D4E5}.btn-ghost:hover{background:#162138}
.btn-danger{background:#BE2B4B;color:#fff}.btn-danger:hover{background:#D23559}
.btn-violet{background:#6D28D9;color:#fff}.btn-violet:hover{background:#7C3AED}
.btn-sm{min-height:30px;padding:0 11px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.link{background:none;border:0;padding:0;color:#67E8F9;font-weight:600;cursor:pointer;text-align:left}.link:hover{text-decoration:underline}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:11.5px;font-weight:600;color:#A9B7CC;letter-spacing:.03em;text-transform:uppercase}
.input,.select,.textarea{width:100%;min-height:38px;border:1px solid #2B3A5C;border-radius:9px;background:#0D1528;padding:8px 11px;font-size:13.5px;color:#E6ECF5}
.select option{background:#111A2E;color:#E6ECF5}
.input::placeholder,.textarea::placeholder{color:#6B7C97}
.textarea{min-height:84px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{border-color:#22D3EE;outline:none;box-shadow:0 0 0 3px rgba(34,211,238,.18)}
.errtext{color:#FF8FA6;font-size:12px;font-weight:500}
.card{background:linear-gradient(180deg,#121C31,#0F182B);border:1px solid #22304D;border-radius:14px;min-width:0;position:relative}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 17px 0}
.card-b{padding:12px 17px 17px}
.kpi{background:linear-gradient(160deg,#142039,#0F182B 70%);border:1px solid #22304D;border-radius:14px;padding:15px 40px 15px 17px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:104px;position:relative;overflow:hidden;color:#E6ECF5}
.kpi::before{content:"";position:absolute;right:-12px;top:-12px;width:46px;height:46px;opacity:.8;clip-path:polygon(25% 6%,75% 6%,100% 50%,75% 94%,25% 94%,0 50%);background:linear-gradient(135deg,rgba(34,211,238,.22),rgba(139,92,246,.22))}
.kpi::after{content:"";position:absolute;left:0;top:0;right:0;height:2px;background:linear-gradient(90deg,#22D3EE,#8B5CF6 60%,transparent)}
.kpi:hover{border-color:#3B4E78}
.kpi-v{font-family:Sora,sans-serif;font-size:28px;font-weight:700;color:#F4F7FB}
.grid{display:grid;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.table-wrap{overflow-x:auto;border:1px solid #22304D;border-radius:14px;background:#0F182B}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#93A3BC;background:#121C31;padding:10px 12px;border-bottom:1px solid #22304D;white-space:nowrap}
.t td{padding:10px 12px;border-bottom:1px solid #1A2540;vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t tbody tr:hover td{background:#131E35}
.th-btn{background:none;border:0;padding:0;font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:#93A3BC;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.sev{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.sev::before{content:"";width:7px;height:7px;clip-path:polygon(25% 6%,75% 6%,100% 50%,75% 94%,25% 94%,0 50%);background:currentColor}
.sev-critical{background:rgba(240,80,110,.14);color:#FF9DB0;border-color:rgba(240,80,110,.35)}.sev-high{background:rgba(251,122,78,.13);color:#FDBA9B;border-color:rgba(251,122,78,.3)}.sev-medium{background:rgba(242,169,59,.12);color:#FCD38A;border-color:rgba(242,169,59,.28)}.sev-low{background:rgba(123,147,168,.14);color:#B9C9D8;border-color:rgba(123,147,168,.3)}
.st{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:6px;white-space:nowrap;border:1px solid transparent}
.st-new{background:rgba(96,165,250,.13);color:#A9CBFF;border-color:rgba(96,165,250,.3)}.st-under-review{background:rgba(34,211,238,.12);color:#8BEAF7;border-color:rgba(34,211,238,.3)}.st-awaiting-verification{background:rgba(139,92,246,.15);color:#CDBDFE;border-color:rgba(139,92,246,.35)}.st-escalated{background:rgba(240,80,110,.14);color:#FF9DB0;border-color:rgba(240,80,110,.35)}.st-resolved{background:rgba(52,211,153,.12);color:#86EFC4;border-color:rgba(52,211,153,.3)}
.st-assigned{background:rgba(96,165,250,.13);color:#A9CBFF}.st-in-progress{background:rgba(34,211,238,.12);color:#8BEAF7}.st-completed{background:rgba(52,211,153,.12);color:#86EFC4}.st-pending{background:rgba(242,169,59,.12);color:#FCD38A}.st-overdue{background:rgba(240,80,110,.14);color:#FF9DB0}
.cls{font-size:12px;font-weight:600;color:#A9B7CC}
.cls-false-positive{color:#86EFC4}.cls-confirmed-security-concern{color:#FF9DB0}.cls-undetermined{color:#FCD38A}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill-ok{background:rgba(52,211,153,.12);color:#86EFC4}.pill-bad{background:rgba(240,80,110,.14);color:#FF9DB0}.pill-warn{background:rgba(242,169,59,.12);color:#FCD38A}.pill-idle{background:#1C2740;color:#A9B7CC}.pill-violet{background:rgba(139,92,246,.16);color:#CDBDFE}.pill-cyan{background:rgba(34,211,238,.12);color:#8BEAF7}
.dot{display:inline-block;width:9px;height:9px;flex:none;clip-path:polygon(25% 6%,75% 6%,100% 50%,75% 94%,25% 94%,0 50%)}
.dot-ok{background:#34D399}.dot-warn{background:#F2A93B}.dot-bad{background:#F0506E}.dot-idle{background:#6B7C97}
.chip{border:1px solid #2B3A5C;background:#121C31;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;min-height:30px;color:#C9D4E5}
.chip.on{background:linear-gradient(135deg,#0891B2,#7C3AED);color:#fff;border-color:transparent}
.tabs{display:flex;gap:4px;border-bottom:1px solid #22304D;flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 13px;font-weight:600;font-size:13px;color:#93A3BC;cursor:pointer;margin-bottom:-1px;min-height:40px}
.tab:hover{color:#E6ECF5}.tab.on{color:#F4F7FB;border-image:linear-gradient(90deg,#22D3EE,#8B5CF6) 1;border-bottom-width:2px;border-bottom-style:solid}
.seg{background:#121C31;border:1px solid #2B3A5C;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;margin-left:-1px;min-height:32px;color:#C9D4E5}
.seg:first-child{border-radius:9px 0 0 9px;margin-left:0}.seg:last-child{border-radius:0 9px 9px 0}
.seg.on{background:linear-gradient(135deg,#0891B2,#7C3AED);color:#fff;border-color:transparent;position:relative}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 13px;border-radius:10px;font-size:12.5px;line-height:1.5}
.banner-info{background:rgba(96,165,250,.08);color:#BFD5F2;border:1px solid rgba(96,165,250,.22)}
.banner-sim{background:rgba(139,92,246,.09);color:#D7CCFE;border:1px solid rgba(139,92,246,.28)}
.banner-warn{background:rgba(242,169,59,.08);color:#F8D9A4;border:1px solid rgba(242,169,59,.26)}
.tag-sim{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#CDBDFE;background:rgba(139,92,246,.16);border:1px solid rgba(139,92,246,.35);border-radius:5px;padding:2px 7px}
.tag-exp{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#8BEAF7;background:rgba(34,211,238,.1);border:1px solid rgba(34,211,238,.3);border-radius:5px;padding:2px 7px}
.tag-plan{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#A9B7CC;background:transparent;border-radius:5px;padding:2px 7px;border:1px dashed #4A5B7C}
.avatar{width:34px;height:34px;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%);background:linear-gradient(135deg,#0E4F63,#3B2A78);color:#E6F9FC;font-weight:700;font-size:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.avatar-lg{width:56px;height:56px;font-size:18px}
.empty{padding:28px 16px;text-align:center;color:#93A3BC;font-size:13px}
.bar-track{background:#1C2740;border-radius:5px;height:8px;overflow:hidden;flex:1;min-width:40px}
.bar-fill{height:100%;border-radius:5px;transition:width .4s}
.prog{height:6px;background:#1C2740;border-radius:5px;overflow:hidden}.prog>div{height:100%;background:linear-gradient(90deg,#22D3EE,#8B5CF6);border-radius:5px}
.zchip{font-family:'JetBrains Mono',monospace;font-size:12px;padding:1px 7px;border-radius:5px;white-space:nowrap}
.z-hi{background:rgba(240,80,110,.16);color:#FF9DB0}.z-mid{background:rgba(242,169,59,.14);color:#FCD38A}.z-lo{background:#1C2740;color:#A9B7CC}
.zcell{border:0;width:100%;min-height:32px;font-family:'JetBrains Mono',monospace;font-size:12px;border-radius:7px;cursor:pointer}
.zcell.z-neg{background:rgba(96,165,250,.12);color:#A9CBFF}.zcell.z-na{background:#121B30;color:#5D6E89}
.kv{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:#93A3BC}.kv dd{margin:0;font-weight:500}
.divider{height:1px;background:#1E2A44;margin:4px 0}
/* shell */
.shell{display:flex;flex-wrap:wrap;min-height:100vh;align-items:stretch;background:radial-gradient(900px 500px at 85% -10%,rgba(139,92,246,.12),transparent 60%),radial-gradient(700px 420px at 20% 0%,rgba(34,211,238,.08),transparent 60%),#0A1020}
.side{flex:1 1 248px;max-width:268px;background:linear-gradient(180deg,#0B1326,#080E1C);color:#B9C6D9;display:flex;flex-direction:column;padding:16px 12px;gap:4px;border-right:1px solid #1A2540;position:relative}
.side::after{content:"";position:absolute;top:0;bottom:0;right:-1px;width:1px;background:linear-gradient(180deg,transparent,rgba(34,211,238,.5),rgba(139,92,246,.5),transparent)}
.collapsed .side{flex:0 0 72px;max-width:72px}
.collapsed .nav-label,.collapsed .side-brand-text,.collapsed .side-foot-text,.collapsed .nav-badge{display:none}
.side-brand{display:flex;align-items:center;gap:12px;padding:4px 6px 16px;border-bottom:1px solid #1A2540;margin-bottom:10px}
.side-brand img{width:44px;height:44px;flex:none;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%);filter:drop-shadow(0 0 8px rgba(34,211,238,.45))}
.brand-name{font-family:Sora,sans-serif;font-weight:800;letter-spacing:.28em;color:#fff;font-size:15px}
.brand-tag{font-size:10.5px;color:#67E8F9;letter-spacing:.04em}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;color:#B9C6D9;padding:9px 11px;border-radius:10px;cursor:pointer;text-align:left;font-size:13px;font-weight:500;min-height:40px;position:relative}
.nav-item:hover{background:#111B31;color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(34,211,238,.16),rgba(139,92,246,.08));color:#fff}
.nav-item.active::before{content:"";position:absolute;left:-12px;top:50%;width:10px;height:12px;transform:translateY(-50%);clip-path:polygon(0 0,100% 50%,0 100%);background:linear-gradient(180deg,#22D3EE,#8B5CF6)}
.nav-ico{width:18px;height:18px;flex:none;color:#6E86A6}
.nav-item.active .nav-ico{color:#67E8F9}
.nav-badge{margin-left:auto;background:#F0506E;color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:0 7px;min-width:20px;text-align:center}
.side-foot{margin-top:auto;border-top:1px solid #1A2540;padding-top:10px;display:flex;flex-direction:column;gap:4px}
.main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 28px;background:rgba(10,16,32,.72);border-bottom:1px solid #1A2540;flex-wrap:wrap;min-height:62px;backdrop-filter:blur(6px)}
.crumbs{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#93A3BC;flex-wrap:wrap}
.crumbs b{color:#E6ECF5;font-weight:600}
.content{padding:24px 28px 44px;display:flex;flex-direction:column;gap:16px;max-width:1580px;width:100%}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.page-h h1::before{content:"";display:inline-block;width:14px;height:16px;margin-right:10px;vertical-align:1px;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%);background:linear-gradient(135deg,#22D3EE,#8B5CF6)}
.page-sub{color:#93A3BC;font-size:13px;margin-top:6px;max-width:780px}
.userchip{display:flex;align-items:center;gap:9px;padding:4px 8px;border-radius:10px}
/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(3,6,14,.66);z-index:40;animation:fade .15s ease;backdrop-filter:blur(2px)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(740px,100vw);background:#0A1020;z-index:41;overflow-y:auto;box-shadow:-18px 0 40px rgba(0,0,0,.5);border-left:1px solid #22304D;animation:slide .22s ease}
.drawer-h{position:sticky;top:0;background:#0E1629;border-bottom:1px solid #22304D;padding:14px 20px;display:flex;align-items:center;gap:10px;z-index:2}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px);overflow-y:auto;background:#111A2E;border:1px solid #2B3A5C;border-radius:16px;z-index:51;box-shadow:0 24px 60px rgba(0,0,0,.6);animation:pop .18s ease}
.modal-scrim{z-index:50}
.modal-h{padding:20px 22px 6px}.modal-b{padding:8px 22px 6px;display:flex;flex-direction:column;gap:12px}.modal-f{padding:14px 22px 20px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:min(390px,calc(100vw - 40px))}
.toast{display:flex;align-items:flex-start;gap:10px;background:#162138;color:#E6ECF5;padding:12px 12px 12px 15px;border-radius:12px;font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,.45);border:1px solid #2B3A5C;border-left:4px solid #22D3EE}
.toast-warn{border-left-color:#F2A93B}
.toast button{background:none;border:0;color:#93A3BC;cursor:pointer;margin-left:auto;min-width:28px;min-height:28px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%)}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
/* charts */
.chart{position:relative;height:200px}
.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.chart-yt{position:absolute;left:-2px;transform:translate(-100%,-50%);font-size:11px;color:#7D8EA8;font-family:'JetBrains Mono',monospace}
.chart-wrap{padding-left:34px}
.chart-x{display:flex;justify-content:space-between;font-size:11px;color:#7D8EA8;margin-top:6px;font-family:'JetBrains Mono',monospace}
.pt{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;border:0;background:transparent;cursor:pointer;padding:0}
.pt::after{content:"";position:absolute;left:4px;top:4px;width:6px;height:6px;border-radius:50%;background:#22D3EE;box-shadow:0 0 6px rgba(34,211,238,.8)}
.pt-hi::after{background:#F2A93B;width:8px;height:8px;left:3px;top:3px;box-shadow:0 0 6px rgba(242,169,59,.8)}
.pt-alert::after{background:#F0506E;width:9px;height:9px;left:2.5px;top:2.5px;box-shadow:0 0 0 2px #0A1020,0 0 10px rgba(240,80,110,.9)}
.pt-sel{box-shadow:0 0 0 2px #E6ECF5}
.pt:hover{background:rgba(34,211,238,.15)}
.bars{display:flex;align-items:flex-end;gap:4px;height:150px;border-bottom:1px solid #22304D}
.barcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;background:none;border:0;padding:0;cursor:pointer;min-width:6px}
.barstack{display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden;min-height:2px;background:#1C2740}
.barcol:hover .barstack{outline:2px solid #67E8F9}
.hbar{display:grid;grid-template-columns:120px 1fr 32px;gap:10px;align-items:center;font-size:12.5px;color:#E6ECF5}
.heat{display:grid;grid-template-columns:38px repeat(24,minmax(0,1fr));gap:2px;font-size:11px}
.heat-cell{height:22px;border-radius:4px;background:#22D3EE}
.heat-off{background:#A78BFA}
.heat-bg{height:22px;border-radius:4px;background:#131D33;position:relative}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#93A3BC;align-items:center}
.lg-sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
/* investigation */
.inv{display:grid;grid-template-columns:minmax(220px,280px) minmax(0,1fr) minmax(280px,360px);gap:14px;align-items:start}
.q-list{display:flex;flex-direction:column;gap:7px;max-height:calc(100vh - 230px);overflow-y:auto;padding:2px}
.q-item{display:flex;flex-direction:column;gap:4px;text-align:left;background:#0F182B;border:1px solid #22304D;border-radius:12px;padding:10px 12px;cursor:pointer;width:100%;color:#E6ECF5}
.q-item:hover{border-color:#3B4E78}
.q-item.on{border-color:#22D3EE;background:linear-gradient(90deg,rgba(34,211,238,.1),rgba(139,92,246,.06));box-shadow:0 0 0 1px rgba(34,211,238,.3),0 8px 20px -12px rgba(34,211,238,.6)}
.tl{display:flex;flex-direction:column;gap:0;position:relative}
.tl-item{display:grid;grid-template-columns:52px 58px 1fr;gap:10px;padding:9px 0;border-bottom:1px dashed #22304D;font-size:13px;align-items:baseline}
.evsrc{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;padding:1px 6px;border-radius:5px;text-align:center;background:#1C2740;color:#C9D4E5}
.evsrc-device{background:rgba(242,169,59,.14);color:#FCD38A}.evsrc-file{background:rgba(34,211,238,.12);color:#8BEAF7}.evsrc-logon{background:rgba(96,165,250,.13);color:#A9CBFF}.evsrc-email{background:rgba(139,92,246,.16);color:#CDBDFE}.evsrc-http{background:rgba(123,147,168,.16);color:#B9C9D8}
.scorebar{height:8px;border-radius:5px;background:linear-gradient(90deg,#7B93A8 0 45%,#F2A93B 45% 70%,#FB7A4E 70% 85%,#F0506E 85%);position:relative}
.scorepin{position:absolute;top:-5px;width:4px;height:18px;background:#F4F7FB;border-radius:2px;box-shadow:0 0 8px rgba(255,255,255,.6)}
.note{background:#0D1528;border:1px solid #1E2A44;border-radius:10px;padding:10px 12px;font-size:13px}
/* graph */
.gwrap{position:relative;height:620px;background:radial-gradient(circle at 50% 40%,#111B33,#070C18 75%);border-radius:14px;overflow:hidden;cursor:grab;touch-action:none;border:1px solid #22304D}
.gcanvas{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform .2s ease}
.gedge{position:absolute;height:1.5px;transform-origin:0 50%;pointer-events:none}
.gnode{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px;cursor:pointer;color:#E6ECF5;max-width:240px}
.gnode-dot{width:16px;height:16px;border-radius:50%;flex:none;border:2px solid #070C18}
.gnode-employee .gnode-dot{width:22px;height:22px;border-radius:0;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.gnode-department .gnode-dot{border-radius:4px;width:18px;height:18px}
.gnode-resource .gnode-dot{border-radius:3px;transform:rotate(45deg)}
.gnode-text{display:flex;flex-direction:column;text-align:left;line-height:1.2}
.gnode-label{font-size:12.5px;font-weight:600;white-space:nowrap}
.gnode-sub{font-size:10.5px;color:#8FA0B3;white-space:nowrap}
.gctl{position:absolute;display:flex;gap:4px;z-index:3}
.gbtn{min-width:34px;min-height:34px;border-radius:9px;border:1px solid #2C394C;background:#141E33;color:#DDE5EE;cursor:pointer;font-weight:700}
.gbtn:hover{background:#1E2B47}
/* model */
.mrow.on td{background:rgba(34,211,238,.07)}
.mst{font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.mst-ev-int{background:rgba(34,211,238,.12);color:#8BEAF7;border:1px solid rgba(34,211,238,.3)}.mst-ev{background:rgba(52,211,153,.12);color:#86EFC4;border:1px solid rgba(52,211,153,.3)}.mst-prop{background:transparent;color:#A9B7CC;border:1px dashed #4A5B7C}
.ens-bar{height:22px;border-radius:6px;background:#2B3A5C;display:flex;align-items:center;justify-content:flex-end;padding-right:7px;color:#E6ECF5;font-size:11.5px;font-weight:600}
.ens-bar.on{background:linear-gradient(90deg,#6D28D9,#A78BFA);color:#fff}
/* employee portal */
.eshell{min-height:100vh;display:flex;flex-direction:column;background:radial-gradient(800px 400px at 90% 0%,rgba(139,92,246,.12),transparent 60%),#0A1020}
.etop{background:linear-gradient(90deg,#0B1326,#120F2C);color:#fff;padding:0 26px;display:flex;align-items:center;gap:16px;min-height:64px;flex-wrap:wrap;border-bottom:1px solid #1A2540}
.etop img{clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%);border-radius:0 !important}
.enav{background:#0C1428;border-bottom:1px solid #1A2540;padding:0 20px;display:flex;gap:2px;flex-wrap:wrap}
.enav-item{background:none;border:0;border-bottom:2px solid transparent;padding:13px 13px;font-weight:600;font-size:13px;color:#93A3BC;cursor:pointer;display:flex;gap:6px;align-items:center;min-height:48px}
.enav-item:hover{color:#E6ECF5}.enav-item.active{color:#fff;border-image:linear-gradient(90deg,#22D3EE,#8B5CF6) 1;border-bottom-width:2px;border-bottom-style:solid}
.econtent{max-width:1140px;width:100%;margin:0 auto;padding:26px 20px 52px;display:flex;flex-direction:column;gap:16px}
.ecard{background:linear-gradient(180deg,#121C31,#0F182B);border:1px solid #22304D;border-radius:16px;padding:20px}
.action-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #1A2540;flex-wrap:wrap}
.action-row:last-child{border-bottom:0}
.due{font-size:12px;color:#93A3BC}.due-soon{color:#FCD38A;font-weight:600}.due-over{color:#FF9DB0;font-weight:600}
.ring{width:100px;height:100px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;filter:drop-shadow(0 0 12px rgba(34,211,238,.35))}
.ring-in{width:78px;height:78px;border-radius:50%;background:#0F182B;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Sora,sans-serif;font-weight:700;font-size:20px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid #22304D;border-radius:10px;padding:11px 13px;cursor:pointer;background:#0D1528;min-height:44px}
.opt:hover{border-color:#3B4E78}.opt.picked{border-color:#22D3EE;background:rgba(34,211,238,.07)}
.opt.right{border-color:#34D399;background:rgba(52,211,153,.08)}.opt.wrong{border-color:#F0506E;background:rgba(240,80,110,.08)}
.opt input{margin-top:3px;accent-color:#22D3EE}
.tstep{display:flex;gap:8px;align-items:center;background:none;border:0;padding:7px 8px;border-radius:8px;cursor:pointer;text-align:left;font-size:12.5px;color:#93A3BC;width:100%;min-height:36px}
.tstep-n{width:24px;height:24px;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%);background:#1C2740;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.tstep.on{background:rgba(34,211,238,.08);color:#F4F7FB;font-weight:600}.tstep.on .tstep-n{background:linear-gradient(135deg,#0891B2,#7C3AED);color:#fff}
.tstep.done .tstep-n{background:rgba(52,211,153,.25);color:#86EFC4}
.mail{border:1px solid #22304D;border-radius:12px;overflow:hidden;background:#0D1528}
.mail-h{background:#121C31;padding:12px 14px;border-bottom:1px solid #22304D;font-size:13px;display:flex;flex-direction:column;gap:3px}
.feedback{border-radius:10px;padding:12px 14px;font-size:13px}
.fb-ok{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.3)}.fb-bad{background:rgba(240,80,110,.08);border:1px solid rgba(240,80,110,.3)}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid #22304D;border-radius:11px;padding:12px;cursor:pointer;background:#0D1528}
.choice.on{border-color:#22D3EE;background:rgba(34,211,238,.07)}
.hist{display:grid;grid-template-columns:16px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid #1A2540}
.hdot{width:10px;height:11px;margin-top:5px;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}.hdot-assign{background:#A78BFA}.hdot-done{background:#34D399}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;min-height:40px}
.switch input{width:18px;height:18px;accent-color:#22D3EE}
.vtab{background:none;border:0;text-align:left;padding:9px 12px;border-radius:9px;font-weight:600;font-size:13px;color:#A9B7CC;cursor:pointer;width:100%;min-height:38px}
.vtab:hover{background:#162138}.vtab.on{background:linear-gradient(90deg,rgba(34,211,238,.16),rgba(139,92,246,.1));color:#fff}
/* login — Nightwatch */
.nw-login{min-height:100vh;display:flex;flex-wrap:wrap;align-items:stretch;background:radial-gradient(900px 600px at 30% 40%,rgba(34,211,238,.12),transparent 60%),radial-gradient(800px 600px at 80% 70%,rgba(139,92,246,.14),transparent 60%),#060B17;position:relative;overflow:hidden}
.nw-login::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(103,232,249,.22) 1px,transparent 1.4px);background-size:28px 28px;mask-image:radial-gradient(circle at 35% 45%,#000 0,transparent 70%);-webkit-mask-image:radial-gradient(circle at 35% 45%,#000 0,transparent 70%)}
.nw-hero{flex:1 1 520px;padding:48px 56px;display:flex;flex-direction:column;gap:26px;position:relative;z-index:1;justify-content:center}
.nw-emblem{position:relative;width:300px;height:300px;margin:6px 0 4px;display:flex;align-items:center;justify-content:center}
.nw-ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 55%,rgba(34,211,238,.9) 70%,rgba(139,92,246,.9) 85%,transparent 100%);mask:radial-gradient(circle,transparent 63%,#000 64%,#000 66%,transparent 67%);-webkit-mask:radial-gradient(circle,transparent 63%,#000 64%,#000 66%,transparent 67%);animation:spin 14s linear infinite}
.nw-ring2{position:absolute;inset:26px;border-radius:50%;border:1px dashed rgba(139,92,246,.45);animation:spin 40s linear infinite reverse}
.nw-hex{position:absolute;inset:44px;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%);background:linear-gradient(135deg,rgba(34,211,238,.25),rgba(139,92,246,.25));animation:breathe 5s ease-in-out infinite}
.nw-hex-in{position:absolute;inset:47px;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%);background:#070D1B}
.nw-emblem img{position:relative;width:176px;height:176px;clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%);filter:drop-shadow(0 0 22px rgba(34,211,238,.5))}
.nw-node{position:absolute;width:9px;height:9px;border-radius:50%;background:#22D3EE;box-shadow:0 0 10px #22D3EE}
.nw-form-side{flex:1 1 440px;display:flex;align-items:center;justify-content:center;padding:40px 24px;position:relative;z-index:1}
.nw-card{width:100%;max-width:430px;display:flex;flex-direction:column;gap:18px;background:rgba(17,26,46,.82);border:1px solid #2B3A5C;border-radius:20px;padding:30px;box-shadow:0 30px 80px -30px rgba(0,0,0,.8),0 0 0 1px rgba(34,211,238,.06);backdrop-filter:blur(10px)}
.demo-acc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#0D1528;border:1px solid #22304D;border-radius:12px;padding:10px 12px;cursor:pointer;min-height:54px;color:#E6ECF5}
.demo-acc:hover{border-color:#22D3EE;background:#101B33}
.nw-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:620px}
.nw-stat{border:1px solid #1E2A44;border-radius:14px;padding:14px;background:rgba(13,21,40,.7)}
.nw-stat b{display:block;font-family:Sora,sans-serif;font-size:22px;font-weight:700;color:#fff;margin:6px 0 2px}
@media (max-width:1180px){.inv{grid-template-columns:minmax(0,1fr)}.q-list{max-height:260px}}
@media (max-width:720px){.side{max-width:none;flex:1 1 100%}.collapsed .side{max-width:none;flex:1 1 100%}.content{padding:16px}.topbar{padding:10px 16px}.nw-hero{padding:32px 22px}.nw-stats{grid-template-columns:1fr}.nw-emblem{width:240px;height:240px}.hbar{grid-template-columns:90px 1fr 28px}}
@media (prefers-reduced-motion:reduce){.nw-ring,.nw-ring2,.nw-hex{animation:none}}

/* Employee navigation moved from horizontal top tabs to a full-height sidebar. */
.employee-layout{display:flex;flex:1;min-height:calc(100vh - 64px);min-width:0}
.employee-sidebar{width:249px;flex:none;background:#0C1428;border-right:1px solid #1D2944;display:flex;flex-direction:column;padding:23px 12px 14px;gap:6px}
.employee-side-label{padding:0 13px 12px;font-size:10px;font-weight:800;color:#6F84A6;letter-spacing:.13em}
.employee-sidebar .enav-item{width:100%;display:flex;align-items:center;text-align:left;border:0;border-radius:10px;padding:12px 13px;gap:11px;min-height:43px;font-size:13px;font-weight:600;color:#B9C6D9;background:transparent;white-space:normal;cursor:pointer}
.employee-sidebar .enav-item:hover{background:#13213B;color:#FFF}
.employee-sidebar .enav-item.active{border:0;background:linear-gradient(90deg,rgba(34,211,238,.16),rgba(139,92,246,.11));color:#FFF}
.employee-nav-dot{display:inline-block;width:9px;height:9px;flex:none;border:1.5px solid #6F84A6;border-radius:3px}
.employee-sidebar .enav-item.active .employee-nav-dot{background:#42D6EC;border-color:#42D6EC}
.employee-nav-label{flex:1}.employee-sidebar-foot{margin-top:auto;padding:15px 13px;border-top:1px solid #23304B}
.employee-layout .econtent{max-width:1200px;min-width:0;flex:1;padding:26px 28px 52px}
.auth-separator{display:flex;align-items:center;gap:12px;color:#8396AF;font-size:12px}
.auth-separator:before,.auth-separator:after{content:"";height:1px;flex:1;background:#25324A}
.google-auth-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;border-radius:10px;background:#F8FAFC;border:1px solid #D8E0EB;color:#182335;padding:11px 14px;min-height:44px;font-weight:700;font-size:13px;cursor:pointer}
.google-auth-btn:hover{background:#E8F1FA}.google-auth-btn:focus-visible{outline:3px solid #67E8F9;outline-offset:3px}
@media(max-width:760px){.employee-layout{flex-direction:column}.employee-sidebar{width:100%;flex-direction:row;flex-wrap:wrap;gap:5px;padding:10px;border-right:0;border-bottom:1px solid #23304B}.employee-side-label,.employee-sidebar-foot{display:none}.employee-sidebar .enav-item{width:auto;flex:1 1 155px;font-size:12px;min-height:40px}.employee-layout .econtent{padding:20px 14px 42px}}
</style>

</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="dc-template">
<div style="min-height: 100vh; background: #0A1020">

<sc-if value="{{isLogin}}" hint-placeholder-val="{{true}}">
<div class="nw-login">
  <section class="nw-hero" aria-label="About SYNAPSE">
    <div class="row" style="gap: 10px"><span class="tag-exp">Cognitive UEBA</span><span class="tag-sim">Prototype · fictional data</span></div>
    <div class="nw-emblem" aria-hidden="true">
      <div class="nw-ring"></div><div class="nw-ring2"></div><div class="nw-hex"></div><div class="nw-hex-in"></div>
      <span class="nw-node" style="left: 6px; top: 146px"></span><span class="nw-node" style="right: 6px; top: 146px; background: #A78BFA; box-shadow: 0 0 10px #A78BFA"></span><span class="nw-node" style="left: 146px; top: 0px"></span>
      <img src="{{mark}}" alt="">
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px; max-width: 600px">
      <div class="brand-name" style="font-size: 30px; letter-spacing: .34em">SYNAPSE</div>
      <div style="font-size: 15px; color: #67E8F9; letter-spacing: .06em">Watching behavior. Protecting people.</div>
      <h1 style="font-size: 36px; line-height: 1.15; font-weight: 700; margin-top: 6px">Behavioral intelligence for proactive security.</h1>
      <p style="margin: 0; color: #A9B7CC; font-size: 15px; line-height: 1.65">Every employee gets their own behavioral baseline. SYNAPSE explains why activity stands out and recommends human-centered responses — training, verification, analyst review — instead of automatic blame.</p>
    </div>
    <div class="nw-stats">
      <div class="nw-stat"><span class="tag-exp">CERT r5.2 · retrospective</span><b>95.59%</b><span class="tiny muted">recall · 28.35% precision on historical synthetic data</span></div>
      <div class="nw-stat"><span class="tag-exp">Personalization</span><b>46</b><span class="tiny muted">predictors · 23 activity + 23 employee-relative deviations</span></div>
      <div class="nw-stat"><span class="tag-sim">Live demo</span><b>Simulated</b><span class="tiny muted">fictional organization; no real monitoring</span></div>
    </div>
    <p class="tiny" style="margin: 0; color: #6B7C97">CT-499 Final Year Design Project · NED University of Engineering &amp; Technology</p>
  </section>
  <section class="nw-form-side">
    <form class="nw-card" onSubmit="{{h.authSubmit}}">
      <div class="row" style="gap: 12px"><img src="{{mark}}" alt="SYNAPSE" style="width: 42px; height: 42px; clip-path: polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)"><div><h2 style="font-size: 21px">{{authTitle}}</h2><div class="tiny muted">Security Operations · Employee Awareness</div></div></div>
      <p class="muted small" style="margin: 0">{{authSubtitle}}</p>
      <sc-if value="{{hasLoginErr}}" hint-placeholder-val="{{false}}">
        <div class="banner" role="alert" style="background: rgba(240,80,110,.1); color: #FFB3C1; border: 1px solid rgba(240,80,110,.35)">{{loginErr}}</div>
      </sc-if>
      <sc-if value="{{isSignupMode}}" hint-placeholder-val="{{false}}"><div class="field"><label for="signup-name">Full name</label><input id="signup-name" class="input" autocomplete="name" value="{{ui.signupName}}" onChange="{{h.signupName}}" placeholder="Your full name"></div></sc-if>
      <div class="field">
        <label for="login-email">Work email</label>
        <input id="login-email" class="input" type="text" inputmode="email" autocomplete="username" value="{{ui.loginEmail}}" onChange="{{h.email}}" placeholder="name@company.example">
        <sc-if value="{{hasEmailErr}}" hint-placeholder-val="{{false}}"><span class="errtext">{{fe.email}}</span></sc-if>
      </div>
      <div class="field">
        <label for="login-pw">Password</label>
        <div style="display: flex; gap: 6px">
          <input id="login-pw" class="input" type="{{pwType}}" autocomplete="current-password" value="{{ui.loginPw}}" onChange="{{h.pw}}" placeholder="••••••••">
          <button type="button" class="btn btn-secondary" onClick="{{h.togglePw}}" aria-label="Toggle password visibility">{{pwToggleLabel}}</button>
        </div>
        <sc-if value="{{hasPwErr}}" hint-placeholder-val="{{false}}"><span class="errtext">{{fe.pw}}</span></sc-if>
      </div>
      <button type="submit" class="btn btn-primary" style="min-height: 44px; font-size: 14px">{{authSubmitLabel}}</button>
      <div class="auth-separator"><span>or</span></div>
      <button type="button" class="google-auth-btn" onClick="{{h.googleAuth}}" aria-label="Continue with Google">
        <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.27 5.48-4.8 7.18l7.73 6C44.38 38.03 46.98 31.88 46.98 24.55z"/><path fill="#FBBC05" d="M10.53 28.59A14.5 14.5 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.2A24 24 0 0 0 0 24c0 3.87.93 7.52 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.8l-7.73-6c-2.15 1.45-4.92 2.3-8.17 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Continue with Google
      </button>
      <p class="tiny muted" style="margin:0">Google authentication needs a configured server-side OAuth integration. No account will be created without server verification.</p>
      <button type="button" class="btn btn-ghost" style="width:100%" onClick="{{h.switchAuth}}">{{authSwitchLabel}}</button>
      <sc-if value="{{isSigninMode}}" hint-placeholder-val="{{true}}">
      <div class="divider"></div>
      <div class="lbl">Demo accounts · click to fill</div>
      <button type="button" class="demo-acc" onClick="{{h.demoAdmin}}"><span class="avatar" style="background: linear-gradient(135deg,#4C1D95,#7C3AED)">NK</span><span style="flex: 1"><b>Administrator</b><br><span class="muted small mono">admin@synapse.demo · Admin#2026</span></span></button>
      <button type="button" class="demo-acc" onClick="{{h.demoAnalyst}}"><span class="avatar">BA</span><span style="flex: 1"><b>Security Analyst</b><br><span class="muted small mono">analyst@synapse.demo · Analyst#2026</span></span></button>
      <button type="button" class="demo-acc" onClick="{{h.demoEmployee}}"><span class="avatar" style="background: linear-gradient(135deg,#065F46,#0E7490)">DO</span><span style="flex: 1"><b>Employee — Daniel Okafor</b><br><span class="muted small mono">daniel.okafor@meridianledger.example · Employee#2026</span></span></button>
      <p class="tiny muted" style="margin: 0">Any employee in the fictional directory can sign in with their work email and <span class="mono">Employee#2026</span>.</p>
      </sc-if>
    </form>
  </section>
</div>
</sc-if>

<sc-if value="{{isStaff}}" hint-placeholder-val="{{false}}">
<div class="{{shellCls}}">
  <nav class="side" aria-label="Security portal navigation">
    <div class="side-brand">
      <img src="{{mark}}" alt="SYNAPSE">
      <div class="side-brand-text"><div class="brand-name">SYNAPSE</div><div class="brand-tag">Security intelligence</div></div>
    </div>
    <sc-for list="{{nav}}" as="n" hint-placeholder-count="10">
      <button type="button" class="{{n.cls}}" onClick="{{n.go}}" aria-current="{{n.current}}" title="{{n.label}}">
        <sc-if value="{{n.ic.grid}}" hint-placeholder-val="{{false}}"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg></sc-if>
        <sc-if value="{{n.ic.radar}}" hint-placeholder-val="{{false}}"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><path d="M12 12l6-6"></path></svg></sc-if>
        <sc-if value="{{n.ic.search}}" hint-placeholder-val="{{false}}"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></sc-if>
        <sc-if value="{{n.ic.users}}" hint-placeholder-val="{{false}}"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"></path><circle cx="17" cy="9" r="2.6"></circle><path d="M16 14.6c2.7.1 4.6 1.8 5.4 4.6"></path></svg></sc-if>
        <sc-if value="{{n.ic.pulse}}" hint-placeholder-val="{{false}}"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 12h4l2.5-6 4 12 2.5-6H21"></path></svg></sc-if>
        <sc-if value="{{n.ic.graph}}" hint-placeholder-val="{{false}}"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="5" cy="6" r="2.5"></circle><circle cx="19" cy="6" r="2.5"></circle><circle cx="12" cy="18" r="2.5"></circle><path d="M7.2 7.2l3.6 8.6M16.8 7.2l-3.6 8.6M7.5 6h9"></path></svg></sc-if>
        <sc-if value="{{n.ic.cpu}}" hint-placeholder-val="{{false}}"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"></rect><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"></path></svg></sc-if>
        <sc-if value="{{n.ic.book}}" hint-placeholder-val="{{false}}"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"></path><path d="M4 5.5v16"></path><path d="M9 8h7"></path></svg></sc-if>
        <sc-if value="{{n.ic.server}}" hint-placeholder-val="{{false}}"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="1.5"></rect><rect x="3" y="13" width="18" height="7" rx="1.5"></rect><path d="M7 7.5h.01M7 16.5h.01"></path></svg></sc-if>
        <sc-if value="{{n.ic.shield}}" hint-placeholder-val="{{false}}"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"></path><path d="M9 12l2 2 4-4"></path></svg></sc-if>
        <sc-if value="{{n.ic.file}}" hint-placeholder-val="{{false}}"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5M9 13h6M9 17h6"></path></svg></sc-if>
        <sc-if value="{{n.ic.gear}}" hint-placeholder-val="{{false}}"><svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></sc-if>
        <span class="nav-label">{{n.label}}</span>
        <sc-if value="{{n.hasBadge}}" hint-placeholder-val="{{false}}"><span class="nav-badge">{{n.badge}}</span></sc-if>
      </button>
    </sc-for>
    <div class="side-foot">
      <button type="button" class="nav-item" onClick="{{h.collapse}}" aria-label="{{collapseLabel}}">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
        <span class="nav-label">{{collapseLabel}}</span>
      </button>
      <div class="side-foot-text tiny" style="color: #7F91A5; padding: 6px 10px">Prototype · simulated data · CERT r5.2 results are retrospective</div>
    </div>
  </nav>

  <div class="main">
    <header class="topbar">
      <div class="crumbs" aria-label="Breadcrumb"><span>SYNAPSE</span><span aria-hidden="true">/</span><span>{{me.roleLabel}} portal</span><span aria-hidden="true">/</span><b>{{pageTitle}}</b></div>
      <span class="tag-sim" style="margin-left: 8px">Demo environment</span>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 8px">
        <div class="userchip"><span class="avatar">{{me.initials}}</span><span style="display: flex; flex-direction: column; line-height: 1.2"><b style="font-size: 13px">{{me.name}}</b><span class="tiny muted">{{me.title}}</span></span></div>
        <button type="button" class="btn btn-secondary btn-sm" onClick="{{h.logout}}">Sign out</button>
      </div>
    </header>

    <main class="content">
      <sc-if value="{{denied}}" hint-placeholder-val="{{false}}">
        <div class="card" style="padding: 40px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center">
          <h1>Access restricted</h1>
          <p class="muted" style="margin: 0">This page is available to System Administrators only. Your role ({{me.roleLabel}}) does not include this permission.</p>
          <button type="button" class="btn btn-primary" onClick="{{goOverview}}">Return to Overview</button>
        </div>
      </sc-if>

      <!-- ================= OVERVIEW ================= -->
      <sc-if value="{{p.overview}}" hint-placeholder-val="{{true}}">
        <div class="page-h">
          <div><h1>Security overview</h1><div class="page-sub">Live-style operations view of the fictional Meridian Ledger Group. Alerts and activity are simulated demonstration data; scores are anomaly indicators, not probabilities of malicious intent.</div></div>
          <div class="row">
            <label class="lbl" for="ov-range" style="margin-right: -4px">Date range</label>
            <select id="ov-range" class="select" style="width: 160px" value="{{ui.range}}" onChange="{{h.range}}">
              <sc-for list="{{rangeOpts}}" as="o" hint-placeholder-count="3"><option value="{{o.v}}">{{o.l}}</option></sc-for>
            </select>
            <button type="button" class="btn btn-secondary" onClick="{{h.refresh}}">Refresh</button>
          </div>
        </div>
        <div class="tiny muted mono" style="margin-top: -6px">{{rangeLabel}}</div>
        <sc-if value="{{ui.loading}}" hint-placeholder-val="{{false}}">
          <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(170px, 1fr))">
            <div class="kpi" style="background: #1C2740; border-color: #1C2740"></div><div class="kpi" style="background: #1C2740; border-color: #1C2740"></div><div class="kpi" style="background: #1C2740; border-color: #1C2740"></div><div class="kpi" style="background: #1C2740; border-color: #1C2740"></div><div class="kpi" style="background: #1C2740; border-color: #1C2740"></div><div class="kpi" style="background: #1C2740; border-color: #1C2740"></div>
          </div>
          <div class="card" style="padding: 40px; text-align: center" role="status"><span class="muted">Loading dashboard data…</span></div>
        </sc-if>
        
        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(170px, 1fr))">
          <sc-for list="{{kpi}}" as="k" hint-placeholder-count="6">
            <button type="button" class="kpi" onClick="{{k.go}}"><span class="lbl">{{k.label}}</span><span class="kpi-v">{{k.value}}</span><span class="tiny muted">{{k.sub}}</span></button>
          </sc-for>
        </div>
        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr))">
          <section class="card">
            <div class="card-h"><h2>Alert trend</h2><span class="tiny muted">{{trendTotal}} alerts in range · click a bar to open Detection Center</span></div>
            <div class="card-b">
              <div class="bars" role="list">
                <sc-for list="{{trend}}" as="b" hint-placeholder-count="14">
                  <button type="button" class="barcol" onClick="{{b.open}}" title="{{b.tip}}" aria-label="{{b.tip}}">
                    <div class="barstack" style="height: {{b.h}}%">
                      <sc-for list="{{b.segs}}" as="sg" hint-placeholder-count="4"><div style="height: {{sg.h}}%; background: {{sg.c}}"></div></sc-for>
                    </div>
                  </button>
                </sc-for>
              </div>
              <div style="display: flex; gap: 4px; margin-top: 6px">
                <sc-for list="{{trend}}" as="b" hint-placeholder-count="14"><div class="tiny mono muted" style="flex: 1; min-width: 6px; text-align: center; white-space: nowrap; overflow: hidden">{{b.label}}</div></sc-for>
              </div>
              <div class="legend" style="margin-top: 10px"><span><i class="lg-sw" style="background: #F0506E"></i>Critical</span><span><i class="lg-sw" style="background: #FB7A4E"></i>High</span><span><i class="lg-sw" style="background: #F2A93B"></i>Medium</span><span><i class="lg-sw" style="background: #7B93A8"></i>Low</span></div>
            </div>
          </section>
          <section class="card">
            <div class="card-h"><h2>Risk severity &amp; activity categories</h2><span class="tiny muted">Alerts in selected range</span></div>
            <div class="card-b" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px">
              <div class="stack" style="gap: 9px">
                <div class="lbl">By severity</div>
                <sc-for list="{{sevDist}}" as="x" hint-placeholder-count="4">
                  <button type="button" class="hbar" onClick="{{x.go}}" style="background: none; border: 0; padding: 0; cursor: pointer; text-align: left"><span>{{x.sev}}</span><span class="bar-track"><span class="bar-fill" style="display: block; width: {{x.w}}%; background: {{x.c}}"></span></span><b class="mono">{{x.n}}</b></button>
                </sc-for>
              </div>
              <div class="stack" style="gap: 9px">
                <div class="lbl">By activity category</div>
                <sc-for list="{{catDist}}" as="x" hint-placeholder-count="5">
                  <div class="hbar"><span>{{x.label}}</span><span class="bar-track"><span class="bar-fill" style="display: block; width: {{x.w}}%; background: #8B5CF6"></span></span><b class="mono">{{x.n}}</b></div>
                </sc-for>
              </div>
            </div>
          </section>
        </div>
        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr))">
          <section class="card">
            <div class="card-h"><h2>Priority investigation queue</h2><span class="tiny muted">Open, by score</span></div>
            <div class="card-b stack" style="gap: 8px">
              <sc-for list="{{queue}}" as="a" hint-placeholder-count="5">
                <button type="button" class="q-item" onClick="{{a.go}}">
                  <span class="row" style="justify-content: space-between"><span class="mono" style="font-weight: 600">{{a.id}}</span><span class="{{a.sevCls}}">{{a.sev}} · {{a.score}}</span></span>
                  <span style="font-weight: 600">{{a.empName}} <span class="muted small" style="font-weight: 400">· {{a.dept}}</span></span>
                  <span class="small muted">{{a.reason}}</span>
                  <span class="row" style="gap: 6px"><span class="{{a.statusCls}}">{{a.status}}</span><span class="tiny muted">{{a.analystName}}</span></span>
                </button>
              </sc-for>
            </div>
          </section>
          <section class="card">
            <div class="card-h"><h2>Recent alerts</h2></div>
            <div class="card-b stack" style="gap: 10px">
              <div class="row" style="gap: 6px" role="group" aria-label="Filter by severity">
                <sc-for list="{{sevChips}}" as="c" hint-placeholder-count="5"><button type="button" class="{{c.cls}}" aria-pressed="{{c.pressed}}" onClick="{{c.go}}">{{c.label}}</button></sc-for>
              </div>
              <sc-if value="{{recentEmpty}}" hint-placeholder-val="{{false}}"><div class="empty">No alerts at this severity.</div></sc-if>
              <sc-for list="{{recent}}" as="a" hint-placeholder-count="6">
                <div class="row" style="justify-content: space-between; border-bottom: 1px solid #1C2740; padding-bottom: 8px; flex-wrap: nowrap">
                  <div style="min-width: 0"><button type="button" class="link mono" onClick="{{a.open}}">{{a.id}}</button> <span class="small">{{a.empName}}</span><div class="tiny muted">{{a.whenShort}} · {{a.catLabel}}</div></div>
                  <span class="{{a.sevCls}}">{{a.sev}}</span>
                </div>
              </sc-for>
            </div>
          </section>
          <section class="card">
            <div class="card-h"><h2>Employees requiring review</h2></div>
            <div class="card-b stack" style="gap: 8px">
              <sc-for list="{{review}}" as="m" hint-placeholder-count="4">
                <button type="button" class="q-item" onClick="{{m.go}}" style="flex-direction: row; align-items: center; gap: 10px">
                  <span class="avatar">{{m.initials}}</span>
                  <span style="flex: 1; min-width: 0"><b>{{m.name}}</b><br><span class="tiny muted">{{m.dept}} · {{m.n}} open alert(s)</span></span>
                  <span class="{{m.sevCls}}">{{m.sev}}</span>
                </button>
              </sc-for>
            </div>
          </section>
        </div>
        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr))">
          
          <section class="card">
            <div class="card-h"><h2>Recent behavioral anomalies</h2><span class="tiny muted">Deviation ≥ 4 SD from the employee’s own baseline · last 7 days</span></div>
            <div class="card-b">
              <table class="t"><thead><tr><th>Day</th><th>Employee</th><th>Feature</th><th>Observed / mean</th><th>Deviation</th></tr></thead><tbody>
                <sc-for list="{{anoms}}" as="x" hint-placeholder-count="5"><tr><td class="mono">{{x.day}}</td><td><button type="button" class="link" onClick="{{x.go}}">{{x.name}}</button></td><td>{{x.label}}</td><td class="mono">{{x.value}} / {{x.mean}}</td><td><span class="zchip z-mid">{{x.z}}</span></td></tr></sc-for>
              </tbody></table>
              <p class="tiny muted" style="margin: 8px 0 0">A deviation is a behavioral indicator, not evidence of malicious intent.</p>
            </div>
          </section>
        </div>
        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr))">
          
          <section class="card">
            <div class="card-h"><h2>Pending analyst actions</h2></div>
            <div class="card-b stack" style="gap: 8px">
              <sc-if value="{{pendingEmpty}}" hint-placeholder-val="{{false}}"><div class="empty">Nothing pending.</div></sc-if>
              <sc-for list="{{pending}}" as="x" hint-placeholder-count="4"><button type="button" class="link small" onClick="{{x.go}}" style="font-weight: 500">→ {{x.text}}</button></sc-for>
            </div>
          </section>
          <section class="card">
            <div class="card-h"><h2>Recent intervention activity</h2></div>
            <div class="card-b stack" style="gap: 8px">
              <sc-for list="{{recentInts}}" as="x" hint-placeholder-count="4"><div class="row small" style="justify-content: space-between; flex-wrap: nowrap"><span style="min-width: 0"><button type="button" class="link mono" onClick="{{x.go}}">{{x.id}}</button> {{x.name}}<br><span class="tiny muted">{{x.label}} · {{x.when}}</span></span><span class="{{x.cls}}">{{x.status}}</span></div></sc-for>
            </div>
          </section>
          
        </div>
      </sc-if>

      <!-- ================= DETECTION ================= -->
      <sc-if value="{{p.detection}}" hint-placeholder-val="{{false}}">
        <div class="page-h">
          <div><h1>Detection Center</h1><div class="page-sub">All alerts with filtering, sorting and export. Risk values are simulated anomaly scores (0–100) from the demo scoring interface; they rank unusual behavior and are not confirmed probabilities of malicious intent.</div></div>
          <div class="row"><button type="button" class="btn btn-secondary" onClick="{{df.clear}}">Clear filters</button><button type="button" class="btn btn-primary" onClick="{{df.export}}">Export CSV</button></div>
        </div>
        <div class="card card-b" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; padding: 14px">
          <div class="field" style="grid-column: span 2"><label for="d-q">Search</label><input id="d-q" class="input" value="{{ui.dq}}" onChange="{{df.q}}" placeholder="Alert ID, employee, reason, model"></div>
          <div class="field"><label for="d-emp">Employee</label><select id="d-emp" class="select" value="{{ui.dEmp}}" onChange="{{df.emp}}"><option value="All">All employees</option><sc-for list="{{employeesOpt}}" as="o" hint-placeholder-count="5"><option value="{{o.id}}">{{o.name}}</option></sc-for></select></div>
          <div class="field"><label for="d-dept">Department</label><select id="d-dept" class="select" value="{{ui.dDept}}" onChange="{{df.dept}}"><option value="All">All</option><sc-for list="{{depts}}" as="o" hint-placeholder-count="5"><option value="{{o.v}}">{{o.v}}</option></sc-for></select></div>
          <div class="field"><label for="d-sev">Severity</label><select id="d-sev" class="select" value="{{ui.dSev}}" onChange="{{df.sev}}"><option value="All">All</option><option value="High+">High + Critical</option><option value="Critical">Critical</option><option value="High">High</option><option value="Medium">Medium</option><option value="Low">Low</option></select></div>
          <div class="field"><label for="d-st">Status</label><select id="d-st" class="select" value="{{ui.dStatus}}" onChange="{{df.status}}"><option value="All">All</option><option value="Open">Open (not resolved)</option><sc-for list="{{statusOpts}}" as="o" hint-placeholder-count="5"><option value="{{o.v}}">{{o.v}}</option></sc-for></select></div>
          <div class="field"><label for="d-model">Detection model</label><select id="d-model" class="select" value="{{ui.dModel}}" onChange="{{df.model}}"><option value="All">All</option><sc-for list="{{models}}" as="o" hint-placeholder-count="3"><option value="{{o.v}}">{{o.v}}</option></sc-for></select></div>
          <div class="field"><label for="d-cat">Activity type</label><select id="d-cat" class="select" value="{{ui.dCat}}" onChange="{{df.cat}}"><option value="All">All</option><sc-for list="{{catOpts}}" as="o" hint-placeholder-count="5"><option value="{{o.v}}">{{o.l}}</option></sc-for></select></div>
          <div class="field"><label for="d-an">Assigned analyst</label><select id="d-an" class="select" value="{{ui.dAnalyst}}" onChange="{{df.analyst}}"><option value="All">All</option><option value="none">Unassigned</option><sc-for list="{{analysts}}" as="o" hint-placeholder-count="2"><option value="{{o.id}}">{{o.name}}</option></sc-for></select></div>
          <div class="field"><label for="d-range">Date range</label><select id="d-range" class="select" value="{{ui.dRange}}" onChange="{{df.range}}"><option value="7">Last 7 days</option><option value="14">Last 14 days</option><option value="30">Last 30 days</option></select></div>
        </div>
        <div class="row" style="justify-content: space-between"><span class="small muted">{{dShowing}}</span><span class="tiny muted">Click a column heading to sort</span></div>
        <div class="table-wrap">
          <table class="t">
            <thead><tr>
              <th><button type="button" class="th-btn" onClick="{{dh.id.go}}" aria-sort="{{dh.id.aria}}">{{dh.id.label}} {{dh.id.ind}}</button></th>
              <th><button type="button" class="th-btn" onClick="{{dh.emp.go}}" aria-sort="{{dh.emp.aria}}">{{dh.emp.label}} {{dh.emp.ind}}</button></th>
              <th><button type="button" class="th-btn" onClick="{{dh.dept.go}}" aria-sort="{{dh.dept.aria}}">{{dh.dept.label}} {{dh.dept.ind}}</button></th>
              <th><button type="button" class="th-btn" onClick="{{dh.ts.go}}" aria-sort="{{dh.ts.aria}}">{{dh.ts.label}} {{dh.ts.ind}}</button></th>
              <th><button type="button" class="th-btn" onClick="{{dh.cat.go}}" aria-sort="{{dh.cat.aria}}">{{dh.cat.label}} {{dh.cat.ind}}</button></th>
              <th><button type="button" class="th-btn" onClick="{{dh.score.go}}" aria-sort="{{dh.score.aria}}">{{dh.score.label}} {{dh.score.ind}}</button></th>
              <th>Detection reason</th><th>Model / source</th>
              <th><button type="button" class="th-btn" onClick="{{dh.status.go}}" aria-sort="{{dh.status.aria}}">{{dh.status.label}} {{dh.status.ind}}</button></th>
              <th><button type="button" class="th-btn" onClick="{{dh.analyst.go}}" aria-sort="{{dh.analyst.aria}}">{{dh.analyst.label}} {{dh.analyst.ind}}</button></th>
              <th>Actions</th>
            </tr></thead>
            <tbody>
              <sc-for list="{{dPageRows}}" as="a" hint-placeholder-count="8">
                <tr>
                  <td><button type="button" class="link mono" onClick="{{a.open}}">{{a.id}}</button></td>
                  <td style="white-space: nowrap">{{a.empName}}</td><td>{{a.dept}}</td><td class="mono" style="white-space: nowrap">{{a.whenShort}}</td><td>{{a.catLabel}}</td>
                  <td><span class="{{a.sevCls}}">{{a.sev}} · {{a.score}}</span></td>
                  <td style="min-width: 220px">{{a.reason}}</td><td class="small muted" style="min-width: 160px">{{a.model}}</td>
                  <td><span class="{{a.statusCls}}">{{a.status}}</span></td><td style="white-space: nowrap">{{a.analystName}}</td>
                  <td><div class="row" style="gap: 6px; flex-wrap: nowrap"><button type="button" class="btn btn-secondary btn-sm" onClick="{{a.open}}">Details</button><button type="button" class="btn btn-ghost btn-sm" onClick="{{a.work}}">Investigate</button></div></td>
                </tr>
              </sc-for>
            </tbody>
          </table>
          <sc-if value="{{dEmpty}}" hint-placeholder-val="{{false}}"><div class="empty">No alerts match these filters. <button type="button" class="link" onClick="{{df.clear}}">Clear filters</button></div></sc-if>
        </div>
        <div class="row" style="justify-content: flex-end"><button type="button" class="btn btn-secondary btn-sm" onClick="{{dPrev}}" disabled="{{dPrevDis}}">Previous</button><span class="small muted">{{dPageLabel}}</span><button type="button" class="btn btn-secondary btn-sm" onClick="{{dNext}}" disabled="{{dNextDis}}">Next</button></div>
      </sc-if>

      <!-- ================= INVESTIGATIONS ================= -->
      <sc-if value="{{p.investigations}}" hint-placeholder-val="{{false}}">
        <div class="page-h">
          <div><h1>Investigation workspace</h1><div class="page-sub">Review evidence against the employee’s own baseline, record findings and choose a proportionate, human-centered response. Analyst actions never change the anomaly score and never block access automatically.</div></div>
        </div>
        <div class="inv">
          <aside class="stack" style="gap: 10px" aria-label="Alert queue">
            <div class="field"><label for="inv-q">Alert queue</label><input id="inv-q" class="input" value="{{ui.invQ}}" onChange="{{invQ}}" placeholder="Search ID, employee, status"></div>
            <div class="q-list">
              <sc-if value="{{invEmpty}}" hint-placeholder-val="{{false}}"><div class="empty">No alerts match.</div></sc-if>
              <sc-for list="{{invList}}" as="a" hint-placeholder-count="8">
                <button type="button" class="{{a.cls}}" onClick="{{a.pick}}" aria-pressed="{{a.current}}">
                  <span class="row" style="justify-content: space-between; flex-wrap: nowrap"><span class="mono" style="font-weight: 600">{{a.id}}</span><span class="{{a.sevCls}}">{{a.sev}}</span></span>
                  <span style="font-weight: 600; font-size: 13px">{{a.empName}}</span>
                  <span class="row" style="gap: 6px"><span class="{{a.statusCls}}">{{a.status}}</span><span class="tiny muted">{{a.analystName}}</span></span>
                </button>
              </sc-for>
            </div>
          </aside>

          <sc-if value="{{hasInv}}" hint-placeholder-val="{{true}}">
          <section class="stack" aria-label="Evidence investigation">
            <div class="card card-b" style="padding: 16px">
              <div class="row" style="justify-content: space-between; align-items: flex-start">
                <div class="stack" style="gap: 6px">
                  <div class="row" style="gap: 8px"><span class="mono" style="font-weight: 600; font-size: 15px">{{inv.id}}</span><span class="{{inv.sevCls}}">{{inv.sev}}</span><span class="{{inv.statusCls}}">{{inv.status}}</span><span class="{{inv.classCls}}">{{inv.classification}}</span><sc-if value="{{inv.closed}}" hint-placeholder-val="{{false}}"><span class="pill pill-idle">Closed</span></sc-if></div>
                  <h2 style="font-size: 18px">{{inv.reason}}</h2>
                  <div class="small muted">{{inv.when}} · {{inv.catLabel}} · {{inv.model}}</div>
                </div>
                <div class="row" style="gap: 6px"><button type="button" class="btn btn-secondary btn-sm" onClick="{{inv.act.profile}}">Employee profile</button><button type="button" class="btn btn-secondary btn-sm" onClick="{{inv.act.behavior}}">Behavioral view</button></div>
              </div>
              <div class="divider" style="margin: 14px 0"></div>
              <div class="row" style="gap: 14px; align-items: flex-start">
                <span class="avatar avatar-lg">{{inv.initials}}</span>
                <dl class="kv" style="flex: 1; min-width: 260px; margin: 0">
                  <dt>Employee</dt><dd>{{inv.empName}} <span class="mono muted small">({{inv.emp.id}})</span></dd>
                  <dt>Department · role</dt><dd>{{inv.dept}} · {{inv.role}}</dd>
                  <dt>Endpoints</dt><dd>{{inv.devices}}</dd>
                  <dt>Removable devices</dt><dd>{{inv.rms}}</dd>
                  <dt>Baseline</dt><dd>{{inv.baselineLabel}}</dd>
                </dl>
              </div>
            </div>

            <div class="card">
              <div class="card-h"><h2>Historical behavior · {{inv.catLabel}}</h2><span class="legend"><span><i class="lg-sw" style="background: #12394A"></i>Expected range (mean ± 2 SD)</span><span><i class="lg-sw" style="background: #F0506E"></i>Alert day</span></span></div>
              <div class="card-b">
                <sc-if value="{{inv.hasChart}}" hint-placeholder-val="{{true}}">
                  <div class="chart-wrap"><div class="chart" style="height: 170px">
                    <sc-for list="{{inv.chart.ticks}}" as="t" hint-placeholder-count="3"><span class="chart-yt" style="top: {{t.top}}%">{{t.label}}</span></sc-for>
                    <svg viewBox="0 0 600 200" preserveAspectRatio="none" aria-hidden="true"><path d="{{inv.chart.bandPath}}" fill="#22D3EE" fill-opacity="0.14"></path><path d="{{inv.chart.meanPath}}" stroke="#22D3EE" stroke-dasharray="4 4" stroke-width="1" vector-effect="non-scaling-stroke" fill="none"></path><path d="{{inv.chart.path}}" fill="none" stroke="#E6ECF5" stroke-width="1.8" vector-effect="non-scaling-stroke"></path></svg>
                    <sc-if value="{{inv.chart.hasMark}}" hint-placeholder-val="{{false}}"><span class="pt pt-alert" style="left: {{inv.chart.mark.left}}%; top: {{inv.chart.mark.top}}%" aria-hidden="true"></span></sc-if>
                  </div></div>
                  <div class="chart-x" style="padding-left: 34px"><span>{{inv.chart.first}}</span><span>Daily {{inv.catLabel}} events (simulated)</span><span>{{inv.chart.last}}</span></div>
                </sc-if>
                <sc-if value="{{inv.noChart}}" hint-placeholder-val="{{false}}"><div class="empty">Baseline chart unavailable — no activity history for this employee.</div></sc-if>
              </div>
            </div>

            <div class="card">
              <div class="card-h"><h2>Activity on {{inv.date}} versus baseline</h2><span class="tiny muted">Login · USB/file · email/web metadata</span></div>
              <div class="card-b">
                <table class="t"><thead><tr><th>Source</th><th>Events</th><th>Off-hours</th><th>Personal mean</th><th>Deviation</th></tr></thead><tbody>
                  <sc-for list="{{inv.dayRows}}" as="r" hint-placeholder-count="5"><tr><td>{{r.label}}</td><td class="mono">{{r.value}}</td><td class="mono">{{r.off}}</td><td class="mono">{{r.mean}}</td><td><span class="{{r.cls}}">{{r.z}} SD</span></td></tr></sc-for>
                </tbody></table>
              </div>
            </div>

            <div class="card">
              <div class="card-h" style="padding-bottom: 0"><div class="tabs" role="tablist" style="flex: 1; border-bottom: 0"><sc-for list="{{invTabs}}" as="t" hint-placeholder-count="3"><button type="button" role="tab" class="{{t.cls}}" aria-selected="{{t.sel}}" onClick="{{t.go}}">{{t.label}}</button></sc-for></div></div>
              <div class="divider" style="margin: 0"></div>
              <div class="card-b">
                <sc-if value="{{invT.timeline}}" hint-placeholder-val="{{true}}">
                  <div class="tl">
                    <sc-if value="{{inv.hasEvents}}" hint-placeholder-val="{{true}}"><sc-for list="{{inv.events}}" as="e" hint-placeholder-count="4"><div class="tl-item"><span class="mono">{{e.t}}</span><span class="{{e.srcCls}}">{{e.src}}</span><span>{{e.detail}}</span></div></sc-for></sc-if>
                  </div>
                  <sc-if value="{{inv.hasContext}}" hint-placeholder-val="{{false}}"><div class="stack" style="gap: 6px; margin-top: 12px"><div class="lbl">Organizational context</div><sc-for list="{{inv.context}}" as="c" hint-placeholder-count="2"><div class="banner banner-info">{{c}}</div></sc-for></div></sc-if>
                  <sc-if value="{{inv.hasRelated}}" hint-placeholder-val="{{false}}"><div class="stack" style="gap: 6px; margin-top: 12px"><div class="lbl">Related alerts for this employee</div><sc-for list="{{inv.related}}" as="r" hint-placeholder-count="2"><div class="row small"><button type="button" class="link mono" onClick="{{r.open}}">{{r.id}}</button><span class="muted">{{r.whenShort}}</span><span>{{r.reason}}</span><span class="{{r.statusCls}}">{{r.status}}</span><span class="{{r.classCls}}">{{r.classification}}</span></div></sc-for></div></sc-if>
                </sc-if>
                <sc-if value="{{invT.evidence}}" hint-placeholder-val="{{false}}">
                  <table class="t"><thead><tr><th>Evidence ID</th><th>Date</th><th>Time</th><th>Source</th><th>Record (metadata only)</th></tr></thead><tbody>
                    <sc-for list="{{inv.events}}" as="e" hint-placeholder-count="4"><tr><td class="mono">{{e.evId}}</td><td class="mono">{{e.date}}</td><td class="mono">{{e.t}}</td><td><span class="{{e.srcCls}}">{{e.src}}</span></td><td>{{e.detail}}</td></tr></sc-for>
                  </tbody></table>
                  <p class="tiny muted" style="margin: 8px 0 0">Evidence records are simulated demonstration events. Message and file contents are never collected.</p>
                </sc-if>
                <sc-if value="{{invT.history}}" hint-placeholder-val="{{false}}">
                  <div class="stack" style="gap: 6px"><sc-for list="{{inv.historyV}}" as="hx" hint-placeholder-count="4"><div class="row small" style="flex-wrap: nowrap; align-items: baseline"><span class="mono tiny muted" style="min-width: 130px">{{hx.when}}</span><b style="min-width: 120px">{{hx.user}}</b><span>{{hx.action}}</span></div></sc-for></div>
                </sc-if>
              </div>
            </div>
          </section>
          </sc-if>

          <sc-if value="{{hasInv}}" hint-placeholder-val="{{true}}">
          <aside class="stack" aria-label="Explainability and decisions">
            <div class="card card-b" style="padding: 16px">
              <h2>Why this alert</h2>
              <p class="small" style="margin: 8px 0 12px">{{inv.reason}}. The score summarizes how far the day’s activity sits from this employee’s historical pattern.</p>
              <div class="row" style="justify-content: space-between"><span class="lbl">Anomaly score (simulated)</span><b class="mono">{{inv.score}} / 100</b></div>
              <div class="scorebar" style="margin: 8px 0 4px"><span class="scorepin" style="left: {{inv.scoreW}}%"></span></div>
              <div class="row tiny muted" style="justify-content: space-between"><span>Low</span><span>Medium 45</span><span>High 70</span><span>Critical 85</span></div>
              <div class="banner banner-sim" style="margin-top: 10px">Source: {{inv.model}}. Period: complete day {{inv.date}}. Not a probability of malicious intent; uncalibrated score for prioritization.</div>
            </div>
            <div class="card card-b" style="padding: 16px">
              <h3>Main anomalous features</h3>
              <sc-if value="{{inv.hasFeatures}}" hint-placeholder-val="{{true}}">
                <div class="stack" style="gap: 10px; margin-top: 10px">
                  <sc-for list="{{inv.features}}" as="f" hint-placeholder-count="4">
                    <div class="stack" style="gap: 4px">
                      <div class="row small" style="justify-content: space-between; flex-wrap: nowrap"><span>{{f.label}}</span><span class="mono" style="font-weight: 600">{{f.zLabel}}</span></div>
                      <div class="bar-track"><div class="bar-fill" style="width: {{f.w}}%; background: {{f.barColor}}"></div></div>
                      <div class="tiny muted mono">observed {{f.value}} · mean {{f.mean}} · SD {{f.sd}} · {{f.ratio}}</div>
                    </div>
                  </sc-for>
                </div>
                <p class="tiny muted" style="margin: 10px 0 0">Baseline-deviation evidence (largest deviations from the employee’s own training-period mean). These are not SHAP attributions.</p>
              </sc-if>
            </div>
            <div class="card card-b" style="padding: 16px">
              <h3>Applicable policies</h3>
              <sc-if value="{{inv.hasPolicies}}" hint-placeholder-val="{{true}}"><div class="stack" style="gap: 6px; margin-top: 8px"><sc-for list="{{inv.policies}}" as="p" hint-placeholder-count="2"><div class="small"><span class="mono muted">{{p.id}}</span> {{p.name}} <span class="tiny muted">· {{p.cat}}</span></div></sc-for></div></sc-if>
              <p class="tiny muted" style="margin: 8px 0 0">A policy match is a security indicator, not proof of wrongdoing.</p>
            </div>
            <sc-if value="{{inv.hasVerif}}" hint-placeholder-val="{{false}}">
              <div class="card card-b" style="padding: 16px">
                <h3>Verification requests</h3>
                <sc-for list="{{inv.verif}}" as="v" hint-placeholder-count="1">
                  <div class="note" style="margin-top: 8px"><div class="row" style="justify-content: space-between"><span class="mono">{{v.id}}</span><span class="pill pill-violet">{{v.status}}</span></div><div class="tiny muted">Sent {{v.when}}</div>
                    <sc-if value="{{v.hasResp}}" hint-placeholder-val="{{false}}"><div class="small" style="margin-top: 6px">Response {{v.responded}}: “{{v.comment}}”</div></sc-if>
                    <sc-if value="{{v.canReview}}" hint-placeholder-val="{{false}}"><button type="button" class="btn btn-secondary btn-sm" style="margin-top: 8px" onClick="{{v.review}}">Mark outcome reviewed</button></sc-if>
                  </div>
                </sc-for>
              </div>
            </sc-if>
            <div class="card card-b" style="padding: 16px">
              <h3>Analyst notes</h3>
              <sc-if value="{{isAnalyst}}" hint-placeholder-val="{{true}}">
                <div class="field" style="margin-top: 8px"><label for="inv-note" class="tiny">Add investigation note</label><textarea id="inv-note" class="textarea" value="{{ui.noteText}}" onChange="{{h.noteText}}" placeholder="Record findings, sources checked, conversations…"></textarea></div>
                <button type="button" class="btn btn-secondary btn-sm" style="margin-top: 8px" onClick="{{inv.act.note}}">Save note</button>
              </sc-if>
              <div class="stack" style="gap: 6px; margin-top: 10px"><sc-for list="{{inv.notesV}}" as="n" hint-placeholder-count="1"><div class="note"><div class="tiny muted">{{n.user}} · {{n.when}}</div>{{n.text}}</div></sc-for></div>
            </div>
            <sc-if value="{{isAnalyst}}" hint-placeholder-val="{{true}}">
              <div class="card card-b" style="padding: 16px; display: flex; flex-direction: column; gap: 8px">
                <h3>Investigation actions</h3>
                <div class="field"><label for="inv-assign" class="tiny">Assigned analyst</label><select id="inv-assign" class="select" value="{{inv.analyst}}" onChange="{{inv.act.assign}}"><option value="">Unassigned</option><sc-for list="{{analysts}}" as="o" hint-placeholder-count="2"><option value="{{o.id}}">{{o.name}}</option></sc-for></select></div>
                <sc-if value="{{inv.canStart}}" hint-placeholder-val="{{false}}"><button type="button" class="btn btn-primary" onClick="{{inv.act.start}}">Start investigation</button></sc-if>
                <sc-if value="{{inv.canWork}}" hint-placeholder-val="{{true}}">
                  <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 8px">
                    <button type="button" class="btn btn-secondary" onClick="{{inv.act.verify}}">Request verification</button>
                    <button type="button" class="btn btn-secondary" onClick="{{inv.act.train}}">Assign training</button>
                    <button type="button" class="btn btn-secondary" onClick="{{inv.act.fp}}">Mark false positive</button>
                    <button type="button" class="btn btn-secondary" onClick="{{inv.act.confirm}}">Record concern</button>
                    <button type="button" class="btn btn-danger" onClick="{{inv.act.escalate}}">Escalate</button>
                    <button type="button" class="btn btn-primary" onClick="{{inv.act.resolve}}">Resolve</button>
                  </div>
                </sc-if>
                <sc-if value="{{inv.canClose}}" hint-placeholder-val="{{false}}"><button type="button" class="btn btn-secondary" onClick="{{inv.act.close}}">Close case</button></sc-if>
                <p class="tiny muted" style="margin: 0">Lifecycle: New → Under Review → Awaiting Verification → Escalated → Resolved. Classification is recorded separately from status and severity.</p>
              </div>
            </sc-if>
            <sc-if value="{{isAdmin}}" hint-placeholder-val="{{false}}"><div class="banner banner-info">Investigation decisions are made by Security Analysts. Administrators have read-only access to cases.</div></sc-if>
          </aside>
          </sc-if>
        </div>
      </sc-if>

      <!-- ================= PEOPLE ================= -->
      <sc-if value="{{p.people}}" hint-placeholder-val="{{false}}">
        <sc-if value="{{showProfile}}" hint-placeholder-val="{{false}}">
          <div class="row"><button type="button" class="btn btn-ghost btn-sm" onClick="{{prof.back}}">← Employee directory</button></div>
          <div class="card card-b" style="padding: 18px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap">
            <span class="avatar avatar-lg">{{prof.initials}}</span>
            <div style="flex: 1; min-width: 220px"><h1 style="font-size: 22px">{{prof.name}}</h1><div class="muted small">{{prof.role}} · {{prof.dept}} · <span class="mono">{{prof.id}}</span></div><div class="tiny muted" style="margin-top: 4px">{{prof.baselineLabel}}</div></div>
